---
# tool-host — FastAPI SDK sidecar (web_search via searxng, etc.)
# Built locally via Tilt's docker_build('catalyst-llm/tool-host', ...)
# and injected into the k3d cluster.
#
# Lives in the local overlay only — promotion to talos00 is tracked
# as a follow-up beads issue (registry push required).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-host
  namespace: catalyst-llm
  labels:
    app.kubernetes.io/name: tool-host
    app.kubernetes.io/component: sdk-sidecar
    app.kubernetes.io/part-of: catalyst-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tool-host
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tool-host
        app.kubernetes.io/component: sdk-sidecar
        app.kubernetes.io/part-of: catalyst-llm
    spec:
      containers:
        - name: tool-host
          image: catalyst-llm/tool-host:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7077
          env:
            - name: SEARXNG_URL
              value: "http://searxng:8080"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: tool-host
  namespace: catalyst-llm
  labels:
    app.kubernetes.io/name: tool-host
    app.kubernetes.io/part-of: catalyst-llm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tool-host
  ports:
    - name: http
      port: 7077
      targetPort: http
