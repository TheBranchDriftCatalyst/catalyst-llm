---
# catalyst-langgraph — Python LangGraph agent service.
# Owns the agent/tool loop; the playground UI talks to it over a
# typed SSE event stream at POST /api/chat/stream.
#
# Built locally via Tilt's docker_build('catalyst-llm/catalyst-langgraph')
# and injected into the k3d dev cluster. Calls tool-host (sibling
# Service) for side-effecting work and LiteLLM (talos00) for LLM
# completions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalyst-langgraph
  namespace: catalyst-llm
  labels:
    app.kubernetes.io/name: catalyst-langgraph
    app.kubernetes.io/component: agent-service
    app.kubernetes.io/part-of: catalyst-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalyst-langgraph
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalyst-langgraph
        app.kubernetes.io/component: agent-service
        app.kubernetes.io/part-of: catalyst-llm
    spec:
      # Same pattern as tool-host: K8s auto-injects $CATALYST_LANGGRAPH_*
      # env vars from the same-named Service, which would clobber
      # config the app reads. Disable the injection.
      enableServiceLinks: false
      containers:
        - name: catalyst-langgraph
          image: catalyst-llm/catalyst-langgraph:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7078
          env:
            - name: PORT
              value: "7078"
            - name: TOOL_HOST_URL
              value: "http://tool-host:7077"
            - name: LITELLM_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: catalyst-llm-config
                  key: LITELLM_BASE_URL
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: master-key
            # Event trace destination. When set, every SSE event is
            # async-written to this DuckDB file for /api/runs to query.
            # Empty / unset = store stays disabled (insert is no-op).
            - name: EVENTS_DB
              value: "/data/events.duckdb"
          volumeMounts:
            # Where the event-trace DuckDB lives. emptyDir in dev (a
            # pod restart wipes the trace, which is fine for k3d); a
            # real PVC in prod once we promote to talos00.
            - name: events
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: events
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: catalyst-langgraph
  namespace: catalyst-llm
  labels:
    app.kubernetes.io/name: catalyst-langgraph
    app.kubernetes.io/part-of: catalyst-llm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: catalyst-langgraph
  ports:
    - name: http
      port: 7078
      targetPort: http
