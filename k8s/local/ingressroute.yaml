---
# Traefik IngressRoutes — local (k3d) overlay
# Access via: http://<service>.local.lan
#
# Add to /etc/hosts on the dev workstation:
#   127.0.0.1  openwebui.local.lan lobechat.local.lan sillytavern.local.lan searxng.local.lan litellm.local.lan

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: open-webui
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/part-of: catalyst-llm
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`openwebui.local.lan`)
      kind: Rule
      services:
        - name: open-webui
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lobe-chat
  labels:
    app.kubernetes.io/name: lobe-chat
    app.kubernetes.io/part-of: catalyst-llm
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`lobechat.local.lan`)
      kind: Rule
      services:
        - name: lobe-chat
          port: 3210
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: searxng
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: catalyst-llm
spec:
  entryPoints:
    - web
