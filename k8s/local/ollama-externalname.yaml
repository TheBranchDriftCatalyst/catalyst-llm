---
# ExternalName Service so pods can resolve `ollama.catalyst-llm.svc.cluster.local`
# to the Mac host running native Ollama. k3d injects `host.k3d.internal`
# as a DNS entry for the host machine.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: catalyst-llm
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: catalyst-llm
    app.kubernetes.io/managed-by: kustomize-local-overlay
spec:
  type: ExternalName
  externalName: host.k3d.internal
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      protocol: TCP
