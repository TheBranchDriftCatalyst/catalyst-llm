---
# Traefik IngressRoutes — talos00 overlay
# Access via: https://<service>.talos00
#
# lobe-chat / sillytavern / searxng are gated by the `authentik` forward-auth
# middleware (SSO via Authentik forward_single providers — blueprint owned by
# talos-homelab infrastructure/base/authentik/sister-apps-blueprint.yaml,
# TALOS-xgrl.14). Each has: websecure route w/ authentik mw + tls:{} (default
# TLSStore serves the *.talos00 wildcard via SNI) + a web→https redirect route.
# open-webui keeps its own auth and is left on plain HTTP.
#
# Requires /etc/hosts entry (or wildcard DNS) on dev workstations:
#   192.168.1.54  openwebui.talos00 lobechat.talos00 sillytavern.talos00 searxng.talos00

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: open-webui
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/part-of: catalyst-llm
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Open WebUI"
    gethomepage.dev/description: "Chat UI for local & API LLMs"
    gethomepage.dev/group: "AI & LLM"
    gethomepage.dev/icon: "open-webui.png"
    gethomepage.dev/href: "http://openwebui.talos00"
    gethomepage.dev/siteMonitor: "http://open-webui.catalyst-llm.svc.cluster.local:8080"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`openwebui.talos00`)
      kind: Rule
      services:
        - name: open-webui
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lobe-chat
  labels:
    app.kubernetes.io/name: lobe-chat
    app.kubernetes.io/part-of: catalyst-llm
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Lobe Chat"
    gethomepage.dev/description: "Modern LLM chat framework"
    gethomepage.dev/group: "AI & LLM"
    gethomepage.dev/icon: "lobe-chat.png"
    gethomepage.dev/href: "https://lobechat.talos00"
    gethomepage.dev/siteMonitor: "http://lobe-chat.catalyst-llm.svc.cluster.local:3210"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`lobechat.talos00`)
      kind: Rule
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: lobe-chat
          port: 3210
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: lobe-chat-http
  labels:
    app.kubernetes.io/name: lobe-chat
    app.kubernetes.io/part-of: catalyst-llm
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`lobechat.talos00`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: lobe-chat
          port: 3210
