---
# Patch base catalyst-llm-config for the talos00 environment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalyst-llm-config
data:
  # In-cluster Service URL — no ingress hop for cluster-internal traffic.
  LITELLM_BASE_URL: "http://litellm.catalyst-llm.svc.cluster.local:4000/v1"
  SEARXNG_BASE_URL: "http://searxng.talos00/"
