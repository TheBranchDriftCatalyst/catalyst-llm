---
# LiteLLM ingress — talos00 overlay
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: litellm-strip-prefix
  labels:
    app: litellm
spec:
  stripPrefix:
    prefixes:
      - /litellm-asset-prefix
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: litellm
  labels:
    app: litellm
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: catalyst-llm
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "LiteLLM"
    gethomepage.dev/description: "LLM API gateway & proxy"
    gethomepage.dev/group: "AI & LLM"
    gethomepage.dev/icon: "litellm.png"
    gethomepage.dev/href: "http://litellm.talos00"
    gethomepage.dev/siteMonitor: "http://litellm.catalyst-llm.svc.cluster.local:4000"
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`litellm.talos00`) && PathPrefix(`/litellm-asset-prefix`)
      middlewares:
        # lan-only 2026-09-26 (TALOS-a8vo.4 / TALOS-k33m): WAN-reachable on web with
        # no perimeter control; host-spoof reached it off-net. lan-only blocks off-LAN;
        # litellm's own API-key auth still applies. NOT authentik (breaks API clients).
        - name: lan-only-strict
          namespace: traefik
        - name: litellm-strip-prefix
      services:
        - name: litellm
          namespace: catalyst-llm
          port: 4000
    - kind: Rule
      match: Host(`litellm.talos00`)
      middlewares:
        - name: lan-only-strict
          namespace: traefik
      services:
        - name: litellm
          namespace: catalyst-llm
          port: 4000
