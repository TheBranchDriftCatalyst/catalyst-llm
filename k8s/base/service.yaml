---
# Service to proxy to AWS Ollama (via Nebula mesh)
# Points to the remote Ollama running on the AWS worker at 10.42.2.1
apiVersion: v1
kind: Service
metadata:
  name: ollama-remote
  namespace: catalyst-llm
  labels:
    app.kubernetes.io/name: catalyst-llm
    app.kubernetes.io/component: ollama-proxy
  annotations:
    description: 'Proxy service to AWS Ollama worker via Nebula mesh'
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      protocol: TCP
---
# Endpoints for the remote Ollama (Nebula mesh IP)
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama-remote
  namespace: catalyst-llm
  labels:
    app.kubernetes.io/name: catalyst-llm
    app.kubernetes.io/component: ollama-proxy
subsets:
  - addresses:
      - ip: 10.42.2.1 # AWS worker Nebula mesh IP
    ports:
      - name: http
        port: 11434
        protocol: TCP

# NOTE: the in-cluster `ollama` Service (the alias name that UIs hit via
# OLLAMA_BASE_URL=http://ollama:11434) is env-specific:
#   - k8s/talos00/ollama-service.yaml  → routes to ollama-remote (AWS)
#   - k8s/local/ollama-externalname.yaml → ExternalName to host.k3d.internal
