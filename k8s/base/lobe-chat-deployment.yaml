---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobe-chat
  namespace: catalyst-llm
  labels:
    app.kubernetes.io/name: lobe-chat
    app.kubernetes.io/component: chat-ui
    app.kubernetes.io/part-of: catalyst-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lobe-chat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lobe-chat
        app.kubernetes.io/component: chat-ui
        app.kubernetes.io/part-of: catalyst-llm
      annotations:
        backup.velero.io/backup-volumes: data
    spec:
      containers:
        - name: lobe-chat
          image: lobehub/lobe-chat:latest
          ports:
            - name: http
              containerPort: 3210
              protocol: TCP
          env:
            # All chat traffic routes through the LiteLLM proxy
            # (deployed at litellm.talos00). Configmap supplies the
            # env-appropriate URL; the auth key comes from the
            # `litellm-secrets` Secret. Lobe also wants the trailing
            # /v1 stripped (it appends it itself), so the configmap
            # provides LITELLM_BASE_URL with /v1 and we use it as-is —
            # Lobe handles both forms.
            - name: OPENAI_PROXY_URL
              valueFrom:
                configMapKeyRef:
                  name: catalyst-llm-config
                  key: LITELLM_BASE_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: master-key
            - name: ENABLED_OPENAI
              value: "1"
            - name: ENABLED_OLLAMA
              value: "0"
            # Disable analytics
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /root/.lobe-chat
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lobe-chat-data
---
apiVersion: v1
kind: Service
metadata:
  name: lobe-chat
  namespace: catalyst-llm
  labels:
    app.kubernetes.io/name: lobe-chat
    app.kubernetes.io/component: chat-ui
    app.kubernetes.io/part-of: catalyst-llm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lobe-chat
  ports:
    - name: http
      port: 3210
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lobe-chat-data
  namespace: catalyst-llm
  labels:
    app.kubernetes.io/name: lobe-chat
    app.kubernetes.io/component: chat-ui
    app.kubernetes.io/part-of: catalyst-llm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
