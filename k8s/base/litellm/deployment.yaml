---
# LiteLLM - Self-hosted OpenAI-compatible LLM API proxy
# https://github.com/BerriAI/litellm
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels:
    app: litellm
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: catalyst-llm
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
        app.kubernetes.io/name: litellm
    spec:
      # litellm has NO wait-for-DB retry: if Prisma cannot reach postgres during
      # startup it raises httpx.ConnectError, "Application startup failed", and the
      # container EXITS (code 3) rather than backing off. Any transient DNS/network
      # blip -- or simply losing the race against postgres on a co-scheduled restart
      # -- turns into a CrashLoopBackOff that only clears on the next retry. Observed
      # 2026-09-12 on a config rollout while postgres had been up 19 days, so this is
      # a startup race, not a postgres outage.
      #
      # Gate startup on the database actually accepting connections. Reuses the
      # pgvector image the postgres pod already runs, so there is no extra pull.
      initContainers:
        - name: wait-for-postgres
          image: pgvector/pgvector:pg16
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h litellm-postgres-rw -p 5432 -U litellm -t 3; do
                echo "waiting for litellm-postgres-rw to accept connections..."
                sleep 2
              done
              echo "postgres is ready"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          imagePullPolicy: Always
          args:
            - "--config=/app/config.yaml"
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: master-key
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: salt-key
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: anthropic-api-key
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: openai-api-key
            # RunPod / Custom inference endpoint
            - name: RUNPOD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: runpod-api-key
            # PostgreSQL (CNPG cluster litellm-postgres, TALOS-5nru).
            # The whole connection string comes from the CNPG-GENERATED app secret,
            # so the password is minted and rotated by the operator and never exists
            # in git or 1Password. Replaces a hand-assembled URL that pointed at the
            # retired co-pod postgres.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-postgres-app
                  key: uri
            # Authentik OIDC SSO Configuration
            - name: GENERIC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: oidc-client-id
            - name: GENERIC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: oidc-client-secret
            - name: GENERIC_AUTHORIZATION_ENDPOINT
              value: "https://auth.knowledgedump.space/application/o/authorize/"
            - name: GENERIC_TOKEN_ENDPOINT
              value: "http://authentik-server.authentik.svc.cluster.local/application/o/token/"
            - name: GENERIC_USERINFO_ENDPOINT
              value: "http://authentik-server.authentik.svc.cluster.local/application/o/userinfo/"
            - name: GENERIC_CLIENT_STATE
              value: "litellm"
            # Scopes requested at /authorize. LiteLLM defaults to
            # "openid email profile" -- the custom litellm_role scope MUST be listed
            # here or Authentik never emits the litellm_role claim in /userinfo, and
            # every SSO user silently lands on internal_user_viewer.
            - name: GENERIC_SCOPE
              value: "openid email profile litellm_role"
            # Map Authentik's litellm_role claim to LiteLLM user roles
            # Requires Authentik property mapping (see docs/authentik-litellm-setup.md)
            - name: GENERIC_USER_ROLE_ATTRIBUTE
              value: "litellm_role"
            # Auto-redirect to SSO login instead of showing username/password form
            - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
              value: "true"
            # External URL for SSO redirect callbacks
            - name: PROXY_BASE_URL
              value: "http://litellm.talos00"
            # Writable paths for UI assets
            - name: LITELLM_UI_PATH
              value: "/tmp/litellm/ui"
            - name: LITELLM_ASSETS_PATH
              value: "/tmp/litellm/assets"
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: litellm-tmp
              mountPath: /tmp/litellm
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: litellm-tmp
          emptyDir: {}
