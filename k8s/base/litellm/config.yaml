      model: ollama/qwen3-coder:30b-a3b-q8_0
      api_base: http://192.168.1.33:11434
    model_info:
      description: Qwen3-Coder 30B-A3B MoE @ Q8_0 (~33GB) — 256K ctx, ~Sonnet 4.5-class agentic coding, BFCL v3 top tier. Q8
        over Q4 because MoE active path is small and we have the memory. - Mac M5 Max Metal
      supports_function_calling: true
      max_input_tokens: 262144
      max_tokens: 262144

