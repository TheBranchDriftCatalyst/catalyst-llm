      description: Qwen3 8B (general chat) @ Q4_K_M (default) — small, fast, most-stable Ollama tool-caller in its size class
        (F1 0.933 on Docker's local-tool-use eval; rarely hallucinates calls). Ideal council member when council_size ≥ 2 —
        sub-second per turn on M5 Max, leaves headroom for parallel members. - Mac M5 Max Metal
      max_input_tokens: 40960
      max_tokens: 40960

