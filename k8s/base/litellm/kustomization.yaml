apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - external-secret.yaml
  - postgresql.yaml
  - deployment.yaml
  - service.yaml
  # ingressroute.yaml lives in env overlays (k8s/talos00, k8s/local)

# configMapGenerator appends a content hash suffix to the ConfigMap name.
# Kustomize auto-updates all volume refs in deployment.yaml.
# Result: any config.yaml change triggers a pod rollout automatically.
configMapGenerator:
  - name: litellm-config
    files:
      - config.yaml
