apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - external-secret.yaml
  # OLD co-pod postgres. Retained DELIBERATELY during the CNPG migration
  # (TALOS-5nru) as the live rollback target -- removed only after the new cluster
  # is verified serving. Do not delete this line and postgres-appdb.yaml's cutover
  # in the same change.
  - postgresql.yaml
  - postgres-appdb.yaml
  - deployment.yaml
  - service.yaml
  - backup-cronjob.yaml
  # ingressroute.yaml lives in env overlays (k8s/talos00, k8s/local)

# configMapGenerator appends a content hash suffix to the ConfigMap name.
# Kustomize auto-updates all volume refs in deployment.yaml.
# Result: any config.yaml change triggers a pod rollout automatically.
configMapGenerator:
  - name: litellm-config
    files:
      - config.yaml
