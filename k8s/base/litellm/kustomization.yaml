apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - external-secret.yaml
  # Postgres is the CNPG cluster litellm-postgres. The old co-pod postgresql.yaml
  # (Deployment + 100Gi PVC + Service + init-pgvector.sql ConfigMap) was retired
  # after the migration was verified serving -- TALOS-5nru.
  - postgres-appdb.yaml
  - deployment.yaml
  - service.yaml
  - backup-cronjob.yaml
  # ingressroute.yaml lives in env overlays (k8s/talos00, k8s/local)

# configMapGenerator appends a content hash suffix to the ConfigMap name.
# Kustomize auto-updates all volume refs in deployment.yaml.
# Result: any config.yaml change triggers a pod rollout automatically.
configMapGenerator:
  - name: litellm-config
    files:
      - config.yaml
