---
# Logical (pg_dump) backup for the litellm CNPG cluster.
#
# KEPT AFTER THE CNPG MIGRATION, DELIBERATELY. The cluster now has its own
# ScheduledBackup to MinIO (litellm-postgres-daily, 03:35), which is the primary and
# the one a restore should use. This job stays as belt-and-braces because it fails
# in a DIFFERENT domain: a logical dump on NFS, versus physical barman backups in
# MinIO. An operator error, a bad MinIO credential rotation or a corrupt WAL chain
# takes out the primary path without touching this one. It costs ~380KB a night now
# that spend-log history is no longer carried.
#
# WHAT IS AT STAKE: LiteLLM_UserTable (including `breakglass-admin`, the documented
# lockout escape when Authentik is down), virtual keys and teams.
#
# 04:45 is a free slot -- the staggered CNPG fleet occupies 02:00 through 04:30, and
# this cluster's own MinIO backup runs at 03:35.
#
# THE `-postgresql-` NAMES BELOW ARE LEFT ALONE ON PURPOSE. They predate the CNPG
# migration and no longer match the cluster name (litellm-postgres), which is ugly
# but harmless. Renaming the PVC would provision a NEW nfs-subdir directory and
# ORPHAN every existing dump -- including PREMIGRATION-preprune-*.dump, the only
# copy of the 1,145,168 spend-log rows that were not migrated. Cosmetics are not
# worth stranding the rollback artifact.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-postgresql-backup
  labels:
    app: litellm-postgresql
    app.kubernetes.io/name: litellm-postgresql
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: catalyst-llm
spec:
  accessModes:
    - ReadWriteMany
  # NFS, not local-path: a node-local backup sitting on the same node as the
  # database it backs up is not a backup. fatboy-nfs-appdata is Retain, so the
  # dumps survive the PVC being deleted.
  storageClassName: fatboy-nfs-appdata
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: litellm-postgresql-backup
  labels:
    app: litellm-postgresql
    app.kubernetes.io/name: litellm-postgresql
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: catalyst-llm
spec:
  schedule: "45 4 * * *"
  # Never let a slow dump overlap the next run against the same database.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # A job that cannot start within 2h has missed its window; do not fire it at a
  # random later hour on top of other work.
  startingDeadlineSeconds: 7200
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: litellm-postgresql
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            # 26 = postgres in the CNPG operand image (NOT 999, which was correct
            # for the old pgvector/postgres image). Verified writing to this same
            # NFS PVC during the migration job.
            runAsUser: 26
            runAsGroup: 26
            fsGroup: 26
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              # MUST track the CNPG operand major. pg_dump REFUSES to dump a server
              # newer than itself, so pinning pg16 here after the 16->18 migration
              # would have silently broken every nightly backup. Using the operand
              # image itself keeps client and server versions identical by
              # construction and needs no extra pull -- the nodes already have it.
              image: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PGHOST
                  value: litellm-postgres-rw
                - name: PGUSER
                  value: litellm
                - name: PGDATABASE
                  value: litellm
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: litellm-postgres-app
                      key: password
                # Keep this many daily dumps.
                - name: RETENTION_DAYS
                  value: "14"
              command: ["bash", "-c"]
              args:
                - |
                  set -euo pipefail

                  stamp="$(date -u +%Y%m%d-%H%M%S)"
                  out="/backup/litellm-${stamp}.dump"

                  echo "==> waiting for postgres"
                  until pg_isready -t 3; do sleep 2; done

                  echo "==> dumping to ${out}"
                  # -Fc custom format: compressed and pg_restore can do selective
                  # restores from it. Write to .partial first so an interrupted run
                  # never leaves a truncated file that looks like a good backup.
                  pg_dump -Fc --no-owner --no-acl -f "${out}.partial"

                  echo "==> verifying the dump is readable"
                  # A dump that cannot be listed is not a backup. This catches
                  # truncation and corruption NOW rather than during a restore.
                  pg_restore --list "${out}.partial" > /dev/null

                  # Sanity-check the table that actually matters for lockout
                  # recovery is present in the archive.
                  if ! pg_restore --list "${out}.partial" | grep -q 'LiteLLM_UserTable'; then
                    echo "FATAL: LiteLLM_UserTable missing from dump -- refusing to keep it" >&2
                    rm -f "${out}.partial"
                    exit 1
                  fi

                  mv "${out}.partial" "${out}"
                  echo "==> wrote $(du -h "${out}" | cut -f1) to ${out}"

                  echo "==> pruning dumps older than ${RETENTION_DAYS}d"
                  find /backup -maxdepth 1 -name 'litellm-*.dump' -type f \
                    -mtime "+${RETENTION_DAYS}" -print -delete

                  # Clean up any partials orphaned by a previous hard kill.
                  find /backup -maxdepth 1 -name 'litellm-*.dump.partial' -type f \
                    -mtime +1 -print -delete

                  echo "==> current dumps:"
                  ls -lh /backup/litellm-*.dump 2>/dev/null | tail -5
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: litellm-postgresql-backup
            # readOnlyRootFilesystem: true, but pg_dump still needs scratch space.
            - name: tmp
              emptyDir: {}
