---
# ExternalSecret to fetch LiteLLM credentials from 1Password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  labels:
    app: litellm
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: catalyst-llm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-secrets
    creationPolicy: Owner
    template:
      data:
        master-key: "{{ .masterKey }}"
        salt-key: "{{ .saltKey }}"
        anthropic-api-key: "{{ .anthropicApiKey }}"
        openai-api-key: "{{ .openaiApiKey }}"
        oidc-client-id: "{{ .oidcClientId }}"
        oidc-client-secret: "{{ .oidcClientSecret }}"
        # NO POSTGRES CREDENTIALS HERE, deliberately (TALOS-5nru). Postgres is the
        # CNPG cluster litellm-postgres; consumers read the entire connection
        # string from the operator-generated `litellm-postgres-app` secret's `uri`
        # key. Both the hand-assembled database-url and postgres-password are gone
        # with the co-pod database -- a credential CNPG mints, owns and rotates
        # beats one copied out of 1Password and pasted into a URL template.
        runpod-api-key: "{{ .runpodApiKey }}"
  data:
    - secretKey: masterKey
      remoteRef:
        key: litellm
        property: master-key
    - secretKey: saltKey
      remoteRef:
        key: litellm
        property: salt-key
    - secretKey: anthropicApiKey
      remoteRef:
        key: litellm
        property: anthropic-api-key
    - secretKey: openaiApiKey
      remoteRef:
        key: litellm
        property: openai-api-key
    - secretKey: oidcClientId
      remoteRef:
        key: litellm
        property: oidc-client-id
    - secretKey: oidcClientSecret
      remoteRef:
        key: litellm
        property: oidc-client-secret
    # RunPod/Custom inference endpoint API key (separate 1Password item)
    - secretKey: runpodApiKey
      remoteRef:
        key: runpod-api-key
        property: password
