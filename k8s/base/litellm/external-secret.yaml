---
# ExternalSecret to fetch LiteLLM credentials from 1Password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  labels:
    app: litellm
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: catalyst-llm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-secrets
    creationPolicy: Owner
    template:
      data:
        master-key: "{{ .masterKey }}"
        salt-key: "{{ .saltKey }}"
        anthropic-api-key: "{{ .anthropicApiKey }}"
        openai-api-key: "{{ .openaiApiKey }}"
        oidc-client-id: "{{ .oidcClientId }}"
        oidc-client-secret: "{{ .oidcClientSecret }}"
        postgres-password: "{{ .postgresPassword }}"
        # database-url REMOVED (TALOS-5nru). Postgres is now the CNPG cluster
        # litellm-postgres, and consumers read the whole connection string from the
        # operator-generated `litellm-postgres-app` secret's `uri` key. A password
        # CNPG mints and owns beats one assembled here from 1Password.
        # postgresPassword below is still used by the retained co-pod postgres in
        # postgresql.yaml, which stays as the rollback target until sign-off.
        runpod-api-key: "{{ .runpodApiKey }}"
  data:
    - secretKey: masterKey
      remoteRef:
        key: litellm
        property: master-key
    - secretKey: saltKey
      remoteRef:
        key: litellm
        property: salt-key
    - secretKey: anthropicApiKey
      remoteRef:
        key: litellm
        property: anthropic-api-key
    - secretKey: openaiApiKey
      remoteRef:
        key: litellm
        property: openai-api-key
    - secretKey: oidcClientId
      remoteRef:
        key: litellm
        property: oidc-client-id
    - secretKey: oidcClientSecret
      remoteRef:
        key: litellm
        property: oidc-client-secret
    - secretKey: postgresPassword
      remoteRef:
        key: litellm
        property: postgres-password
    # RunPod/Custom inference endpoint API key (separate 1Password item)
    - secretKey: runpodApiKey
      remoteRef:
        key: runpod-api-key
        property: password
