---
# Main configuration for catalyst-llm services
#
# Host-agnostic defaults. Env-specific URLs (.talos00 vs .local.lan) are
# patched in via overlays:
#   k8s/talos00/configmap-patch.yaml
#   k8s/local/configmap-patch.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalyst-llm-config
  namespace: catalyst-llm
  labels:
    app.kubernetes.io/name: catalyst-llm-config
    app.kubernetes.io/part-of: catalyst-llm
data:
  # LiteLLM proxy endpoint — UIs route all chat traffic through this.
  # Overlays patch with the env-appropriate URL:
  #   talos00 → http://litellm.catalyst-llm.svc.cluster.local:4000/v1
  #             (in-cluster, no ingress hop)
  #   local   → http://litellm.talos00/v1
  #             (UI in k3d → external ingress to the talos cluster)
  LITELLM_BASE_URL: "http://litellm:4000/v1"

  # Kept for callers that still want direct Ollama access (the
  # ExternalName service in k8s/local maps `ollama` → host.k3d.internal).
  OLLAMA_BASE_URL: "http://ollama:11434"

  # External SearXNG URL — overlays patch this per environment.
  SEARXNG_BASE_URL: "http://searxng/"
---
# SearXNG configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: catalyst-llm
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: catalyst-llm
data:
  settings.yml: |
    # SearXNG settings
    use_default_settings: true

    general:
      instance_name: "Catalyst LLM Search"

    search:
      safe_search: 0
      autocomplete: "duckduckgo"
      default_lang: "en"
      formats:
        - html
        - json

    server:
      limiter: false
      image_proxy: true
      http_protocol_version: "1.0"
      secret_key: "catalyst-llm-searxng-secret-change-me"

    ui:
      static_use_hash: true
      default_theme: simple
      theme_args:
        simple_style: dark

    engines:
      - name: google
        engine: google
        shortcut: g
        disabled: false

      - name: duckduckgo
        engine: duckduckgo
        shortcut: ddg
        disabled: false

      - name: brave
        engine: brave
        shortcut: br
        disabled: false

      - name: github
        engine: github
        shortcut: gh
        disabled: false

      - name: stackoverflow
        engine: stackoverflow
        shortcut: so
        disabled: false

      - name: wikipedia
        engine: wikipedia
        shortcut: wp
        disabled: false
---
# SillyTavern configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: sillytavern-config
  namespace: catalyst-llm
  labels:
    app.kubernetes.io/name: sillytavern
    app.kubernetes.io/part-of: catalyst-llm
data:
  config.yaml: |
    # SillyTavern Configuration
    # Basic server settings
    listen: true
    port: 8000

    # Whitelist settings (allow all for cluster access)
    whitelistMode: false
    whitelist: []

    # Security
    basicAuthMode: false

    # Enable all user features
    enableUserAccounts: true
    enableExtensions: true

    # Autorun settings
    autorun: false

    # Proxy settings (use cluster DNS)
    requestProxy:
      enabled: false

    # Default API connections
    # Users will configure Ollama endpoint in the UI
