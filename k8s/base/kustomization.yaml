---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: catalyst-llm
  labels:
    app.kubernetes.io/name: catalyst-llm
    app.kubernetes.io/part-of: catalyst

namespace: catalyst-llm

resources:
  # Core infrastructure (host-agnostic; ingress + heavy infra live in overlays)
  - namespace.yaml
  - pvc.yaml
  - service.yaml
  - configmap.yaml

  # UI Applications (cheap, run in every env)
  - open-webui-deployment.yaml
  # - sillytavern-deployment.yaml  # TODO: reimplement from scratch
  - lobe-chat-deployment.yaml
  - searxng-deployment.yaml

  # NOT in base — opt-in per env:
  #   - litellm/  → talos00 only (dev uses the deployed proxy)
  #   - claw-runtime/ → talos00 only (composio key not provisioned yet);
  #     directory holds the deployed agent runtime (k8s service), distinct
  #     from packages/openclaw/ which is the local knowledge vault
  #   - ollama/   → disabled across envs (external inference)
  #   - poisonarr/ → has its own namespace

# `labels:` (not `commonLabels:`) applies labels to metadata only.
# `includeSelectors: false` is critical — letting kustomize inject these
# into spec.selector.matchLabels makes the selector immutable AND
# collides with whatever Tilt/Argo CD adds at runtime (which is what
# bit us on the first apply).
labels:
  - pairs:
      app.kubernetes.io/managed-by: argocd
      app.kubernetes.io/part-of: catalyst-llm
    includeSelectors: false
    includeTemplates: false
