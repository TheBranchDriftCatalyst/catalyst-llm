apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  labels:
    app: litellm
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: catalyst-llm
  name: litellm-secrets
  namespace: catalyst-llm
spec:
  data:
  - remoteRef:
      key: litellm
      property: master-key
    secretKey: masterKey
  - remoteRef:
      key: litellm
      property: salt-key
    secretKey: saltKey
  - remoteRef:
      key: litellm
      property: anthropic-api-key
    secretKey: anthropicApiKey
  - remoteRef:
      key: litellm
      property: openai-api-key
    secretKey: openaiApiKey
  - remoteRef:
      key: litellm
      property: oidc-client-id
    secretKey: oidcClientId
  - remoteRef:
      key: litellm
      property: oidc-client-secret
    secretKey: oidcClientSecret
  - remoteRef:
      key: litellm
      property: postgres-password
    secretKey: postgresPassword
  - remoteRef:
      key: runpod-api-key
      property: password
    secretKey: runpodApiKey
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    name: litellm-secrets
    template:
      data:
        anthropic-api-key: '{{ .anthropicApiKey }}'
        database-url: postgresql://litellm:{{ .postgresPassword }}@litellm-postgresql:5432/litellm
        master-key: '{{ .masterKey }}'
        oidc-client-id: '{{ .oidcClientId }}'
        oidc-client-secret: '{{ .oidcClientSecret }}'
        openai-api-key: '{{ .openaiApiKey }}'
        postgres-password: '{{ .postgresPassword }}'
        runpod-api-key: '{{ .runpodApiKey }}'
        salt-key: '{{ .saltKey }}'
