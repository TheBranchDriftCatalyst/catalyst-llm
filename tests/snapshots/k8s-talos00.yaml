apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: litellm
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: catalyst-llm
  name: litellm
  namespace: catalyst-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: litellm
        app.kubernetes.io/name: litellm
    spec:
      containers:
      - args:
        - --config=/app/config.yaml
        env:
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              key: master-key
              name: litellm-secrets
        - name: LITELLM_SALT_KEY
          valueFrom:
            secretKeyRef:
              key: salt-key
              name: litellm-secrets
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              key: anthropic-api-key
              name: litellm-secrets
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: openai-api-key
              name: litellm-secrets
        - name: RUNPOD_API_KEY
          valueFrom:
            secretKeyRef:
              key: runpod-api-key
              name: litellm-secrets
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: database-url
              name: litellm-secrets
        - name: GENERIC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              key: oidc-client-id
              name: litellm-secrets
        - name: GENERIC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: oidc-client-secret
              name: litellm-secrets
        - name: GENERIC_AUTHORIZATION_ENDPOINT
          value: https://auth.knowledgedump.space/application/o/authorize/
        - name: GENERIC_TOKEN_ENDPOINT
          value: http://authentik-server.authentik.svc.cluster.local/application/o/token/
        - name: GENERIC_USERINFO_ENDPOINT
          value: http://authentik-server.authentik.svc.cluster.local/application/o/userinfo/
        - name: GENERIC_CLIENT_STATE
          value: litellm
        - name: GENERIC_USER_ROLE_ATTRIBUTE
          value: litellm_role
        - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
          value: "true"
        - name: PROXY_BASE_URL
          value: http://litellm.talos00
        - name: LITELLM_UI_PATH
          value: /tmp/litellm/ui
        - name: LITELLM_ASSETS_PATH
          value: /tmp/litellm/assets
        image: ghcr.io/berriai/litellm:main-latest
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
        name: litellm
        ports:
        - containerPort: 4000
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
        volumeMounts:
        - mountPath: /app/config.yaml
          name: config
          readOnly: true
          subPath: config.yaml
        - mountPath: /tmp/litellm
          name: litellm-tmp
      volumes:
      - configMap:
          name: litellm-config-2k99bkfmdg
        name: config
      - emptyDir: {}
        name: litellm-tmp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: litellm-postgresql
    app.kubernetes.io/name: litellm-postgresql
    app.kubernetes.io/part-of: catalyst-llm
  name: litellm-postgresql
  namespace: catalyst-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-postgresql
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: data
      labels:
        app: litellm-postgresql
    spec:
      containers:
      - env:
        - name: POSTGRES_DB
          value: litellm
        - name: POSTGRES_USER
          value: litellm
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: postgres-password
              name: litellm-secrets
        image: pgvector/pgvector:pg16
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - litellm
          initialDelaySeconds: 30
          periodSeconds: 10
        name: postgresql
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - litellm
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
        - mountPath: /docker-entrypoint-initdb.d
          name: init-scripts
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: litellm-postgresql
      - configMap:
          name: litellm-postgresql-init
        name: init-scripts
---
