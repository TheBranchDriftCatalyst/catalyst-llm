---
apiVersion: v1
data:
  settings.yml: |
    # SearXNG settings
    use_default_settings: true

    general:
      instance_name: "Catalyst LLM Search"

    search:
      safe_search: 0
      autocomplete: "duckduckgo"
      default_lang: "en"
      formats:
        - html
        - json

    server:
      limiter: false
      image_proxy: true
      http_protocol_version: "1.0"
      secret_key: "catalyst-llm-searxng-secret-change-me"

    ui:
      static_use_hash: true
      default_theme: simple
      theme_args:
        simple_style: dark

    engines:
      - name: google
        engine: google
        shortcut: g
        disabled: false

      - name: duckduckgo
        engine: duckduckgo
        shortcut: ddg
        disabled: false

      - name: brave
        engine: brave
        shortcut: br
        disabled: false

      - name: github
        engine: github
        shortcut: gh
        disabled: false

      - name: stackoverflow
        engine: stackoverflow
        shortcut: so
        disabled: false

      - name: wikipedia
        engine: wikipedia
        shortcut: wp
        disabled: false
