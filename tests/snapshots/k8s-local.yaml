apiVersion: v1
data:
  LITELLM_BASE_URL: http://litellm.talos00/v1
  OLLAMA_BASE_URL: http://ollama:11434
  SEARXNG_BASE_URL: http://searxng.local.lan/
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/managed-by: argocd
