apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: agent-service
    app.kubernetes.io/name: catalyst-langgraph
    app.kubernetes.io/part-of: catalyst-llm
  name: catalyst-langgraph
  namespace: catalyst-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalyst-langgraph
  template:
    metadata:
      labels:
        app.kubernetes.io/component: agent-service
        app.kubernetes.io/name: catalyst-langgraph
        app.kubernetes.io/part-of: catalyst-llm
    spec:
      containers:
      - env:
        - name: PORT
          value: "7078"
        - name: TOOL_HOST_URL
          value: http://tool-host:7077
        - name: LITELLM_BASE_URL
          valueFrom:
            configMapKeyRef:
              key: LITELLM_BASE_URL
              name: catalyst-llm-config
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              key: master-key
              name: litellm-secrets
        - name: EVENTS_DB
          value: /data/events.duckdb
        image: catalyst-llm/catalyst-langgraph:dev
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
        name: catalyst-langgraph
        ports:
        - containerPort: 7078
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        volumeMounts:
        - mountPath: /data
          name: events
      enableServiceLinks: false
      volumes:
      - emptyDir: {}
        name: events
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: chat-ui
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: lobe-chat
    app.kubernetes.io/part-of: catalyst-llm
  name: lobe-chat
  namespace: catalyst-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lobe-chat
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: data
      labels:
        app.kubernetes.io/component: chat-ui
        app.kubernetes.io/name: lobe-chat
        app.kubernetes.io/part-of: catalyst-llm
    spec:
      containers:
      - env:
        - name: OPENAI_PROXY_URL
          valueFrom:
            configMapKeyRef:
              key: LITELLM_BASE_URL
              name: catalyst-llm-config
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: master-key
              name: litellm-secrets
        - name: ENABLED_OPENAI
          value: "1"
        - name: ENABLED_OLLAMA
          value: "0"
        - name: NEXT_TELEMETRY_DISABLED
          value: "1"
        image: lobehub/lobe-chat:latest
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        name: lobe-chat
        ports:
        - containerPort: 3210
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 512Mi
        volumeMounts:
        - mountPath: /root/.lobe-chat
          name: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: lobe-chat-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: chat-ui
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/part-of: catalyst-llm
  name: open-webui
  namespace: catalyst-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes: data
      labels:
        app.kubernetes.io/component: chat-ui
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/part-of: catalyst-llm
    spec:
      containers:
      - env:
        - name: OPENAI_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              key: LITELLM_BASE_URL
              name: catalyst-llm-config
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: master-key
              name: litellm-secrets
        - name: SCARF_NO_ANALYTICS
          value: "true"
        - name: DO_NOT_TRACK
          value: "true"
        - name: WEBUI_AUTH
          value: "true"
        - name: ENABLE_OPENAI_API
          value: "true"
        - name: ENABLE_OLLAMA_API
          value: "false"
        - name: RAG_EMBEDDING_MODEL
          value: sentence-transformers/all-MiniLM-L6-v2
        - name: CHUNK_SIZE
          value: "1000"
        - name: CHUNK_OVERLAP
          value: "100"
        - name: ENABLE_RAG_WEB_SEARCH
          value: "true"
        - name: RAG_WEB_SEARCH_ENGINE
          value: searxng
        - name: SEARXNG_QUERY_URL
          value: http://searxng:8080/search?q=<query>
        - name: RAG_WEB_SEARCH_RESULT_COUNT
          value: "5"
        - name: RAG_WEB_SEARCH_CONCURRENT_REQUESTS
          value: "5"
        image: ghcr.io/open-webui/open-webui:main
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        name: open-webui
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 200m
            memory: 512Mi
        volumeMounts:
        - mountPath: /app/backend/data
          name: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: open-webui-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: search-engine
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: catalyst-llm
  name: searxng
  namespace: catalyst-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/component: search-engine
        app.kubernetes.io/name: searxng
        app.kubernetes.io/part-of: catalyst-llm
    spec:
      containers:
      - env:
        - name: SEARXNG_BASE_URL
          valueFrom:
            configMapKeyRef:
              key: SEARXNG_BASE_URL
              name: catalyst-llm-config
        image: searxng/searxng:latest
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        name: searxng
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          capabilities:
            add:
            - CHOWN
            - SETGID
            - SETUID
            drop:
            - ALL
        volumeMounts:
        - mountPath: /etc/searxng
          name: config
      enableServiceLinks: false
      securityContext:
        fsGroup: 977
        runAsGroup: 977
        runAsUser: 977
      volumes:
      - configMap:
          name: searxng-config
        name: config
---
