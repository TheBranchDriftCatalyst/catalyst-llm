# Root Taskfile — thin DX wrapper around Tilt / k3d / Argo CD / model gen
# plus the cross-package test aggregator.
#
# Run: task --list
version: '3'

# Per-package Taskfiles are mounted as namespaces here. Invoke nested
# tasks as `task <ns>:<task>` (e.g. `task mac-node:test:smoke`). The
# `dir:` setting makes each task run with the package as its cwd.
includes:
  mac-node:
    taskfile: ./packages/mac-node/Taskfile.yaml
    dir: ./packages/mac-node
  sdk:
    taskfile: ./packages/catalyst-llm-sdk/Taskfile.yaml
    dir: ./packages/catalyst-llm-sdk
  langgraph:
    taskfile: ./packages/catalyst-langgraph/Taskfile.yaml
    dir: ./packages/catalyst-langgraph
  tool-host:
    taskfile: ./packages/tool-host/Taskfile.yaml
    dir: ./packages/tool-host

vars:
  K8S_LOCAL: k8s/local
  K8S_TALOS00: k8s/talos00
  ARGO_APP: catalyst-llm

tasks:
  default:
    desc: Show all available tasks
    cmds:
      - task --list

  # ─── Cross-package testing ───────────────────────────────────────────
  # Progressive tiers, each strictly faster/cheaper than the next.
  # Every package exposes the same four verbs (test:lint / test:unit /
  # test:smoke / test:full) so root aggregators just fan out via `deps:`.
  # `task test` (no args) defaults to test:unit — the fast tier.

  test:
    desc: "Alias for test:unit (fast default — unit tests across all packages)"
    cmds:
      - task: test:unit

  test:lint:
    desc: "L1: typecheck + lint across all packages (no services, fast)"
    deps:
      - mac-node:test:lint
      - sdk:test:lint
      - langgraph:test:lint
      - tool-host:test:lint

  test:unit:
    desc: "L2: pure unit tests across all packages (no services, parallel)"
    deps:
      - mac-node:test:unit
      - sdk:test:unit
      - langgraph:test:unit
      - tool-host:test:unit

  test:smoke:
    desc: "L3: unit + service-health smoke across all packages (requires local services)"
    cmds:
      - task: test:unit
      - task: mac-node:test:smoke
      - task: sdk:test:smoke

  test:full:
    desc: "L4: everything — full model × backend sweep (~20min, ISOLATE on)"
    cmds:
      - task: test:lint
      - task: test:unit
      - task: mac-node:test:full
      - task: sdk:test:full

  # Unified HTML report across every package's junit XML. Powers the
  # `test:run` / `test:render` / `test:serve` resources in Tiltfile.
  #
  # Each package's `test:junit` runs the full suite (no -m unit filter).
  # Integration tests self-skip via pytest.mark.skipif when env vars are
  # missing — showing as orange "skipped" rows in the report (visible,
  # not hidden).
  #
  # Env comes from your shell (load via direnv + .envrc, or `source .envrc`).
  test:report:
    desc: "Run all tests (unit + integration when env set) and render docs/reports/index.html"
    cmds:
      - rm -rf docs/reports/junit && mkdir -p docs/reports/junit
      - |
        if [ -n "${LITELLM_API_KEY:-}" ]; then
          echo "✓ LITELLM_API_KEY set — integration tier will run against ${LITELLM_BASE_URL:-<unset>}"
        else
          echo "ℹ LITELLM_API_KEY not set — integration tests will skip (source .envrc or direnv allow)"
        fi
      - task: langgraph:test:junit
      - task: tool-host:test:junit
      - task: sdk:test:unit
      - cp packages/catalyst-langgraph/.reports/junit.xml docs/reports/junit/catalyst-langgraph.xml || true
      - cp packages/tool-host/.reports/junit.xml          docs/reports/junit/tool-host.xml          || true
      - cp packages/catalyst-llm-sdk/.reports/junit.xml   docs/reports/junit/catalyst-llm-sdk.xml   || true
      - npx --yes xunit-viewer -r docs/reports/junit -o docs/reports/index.html -t "Catalyst LLM — Test Report"
      - echo "Report -> $(pwd)/docs/reports/index.html"

  # ─── Repo bootstrap ──────────────────────────────────────────────────
  hooks:install:
    desc: "Activate the repo's git hooks (run once after cloning)"
    cmds:
      - git config core.hooksPath .githooks
      - echo "✓ git hooks active via .githooks/ ($(ls .githooks | tr '\n' ' '))"

  # ─── Tilt ────────────────────────────────────────────────────────────
  up:
    desc: Bring up the dev stack (k3d + native Ollama + UIs)
    cmds:
      - tilt up

  up:prod:
    desc: Bring up the prod ops view (parallel rail at devspace tilt-ops/)
    cmds:
      - tilt up -f tilt-ops/Tiltfile

  down:
    desc: Stop Tilt resources (does NOT delete the k3d cluster)
    cmds:
      - tilt down

  parse:
    desc: Validate that both Tiltfiles parse
    cmds:
      - tilt alpha tiltfile-result                          2>&1 | grep -E "^Error|Traceback" && exit 1 || echo "Tiltfile (dev) OK"
      - tilt alpha tiltfile-result -f tilt-ops/Tiltfile     2>&1 | grep -E "^Error|Traceback" && exit 1 || echo "tilt-ops/Tiltfile (prod) OK"

  # ─── k3d cluster (shared at ../../infra/k3d/) ───────────────────────
  k3d:up:
    desc: Create the shared catalyst-dev k3d cluster (idempotent)
    cmds:
      - ../../infra/k3d/k3d-up.sh

  k3d:down:
    desc: Delete the shared catalyst-dev k3d cluster
    cmds:
      - ../../infra/k3d/k3d-down.sh

  k3d:reset:
    desc: Tear down and recreate the shared cluster from scratch
    cmds:
      - ../../infra/k3d/k3d-down.sh
      - ../../infra/k3d/k3d-up.sh

  # ─── Kustomize validation ────────────────────────────────────────────
  k8s:build:local:
    desc: Render the local (k3d) overlay to stdout
    cmds:
      - kubectl kustomize {{.K8S_LOCAL}}

  k8s:build:talos00:
    desc: Render the talos00 overlay to stdout
    cmds:
      - kubectl kustomize {{.K8S_TALOS00}}

  k8s:check:
    desc: Validate both overlays render without errors
    cmds:
      - kubectl kustomize {{.K8S_LOCAL}}   >/dev/null && echo "k8s/local OK"
      - kubectl kustomize {{.K8S_TALOS00}} >/dev/null && echo "k8s/talos00 OK"

  # ─── Argo CD (prod, talos00) ─────────────────────────────────────────
  argo:sync:
    desc: Sync the catalyst-llm Argo CD application
    cmds:
      - argocd app sync {{.ARGO_APP}}

  argo:diff:
    desc: Show drift between cluster state and the k8s/talos00 overlay
    cmds:
      - argocd app diff {{.ARGO_APP}}

  argo:status:
    desc: Show Argo CD app health + sync status
    cmds:
      - argocd app get {{.ARGO_APP}}

  # ─── Model registry (delegates into packages/mac-node) ───────────────
  models:
    desc: Regenerate everything that derives from models.yaml (litellm config, pull scripts)
    cmds:
      - task -d packages/mac-node generate

  models:download:
    desc: Pull all mac-targeted models from models.yaml (CONCURRENCY=N, ONLY=alias,..., SKIP=alias,...)
    cmds:
      - task -d packages/mac-node models:download {{.CLI_ARGS}}

  models:plan:
    desc: Dry-run of models:download
    cmds:
      - task -d packages/mac-node models:download:plan
