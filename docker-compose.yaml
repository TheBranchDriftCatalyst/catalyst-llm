# Catalyst LLM - Web UIs for Local LLMs
#
# Connects to native ollama on host for GPU-accelerated inference.
# Used by Tiltfile - ollama is managed as a local_resource.
#
# LiteLLM proxy is deployed out-of-cluster at http://litellm.talos00 — the
# local docker-compose stack targets that instead of running its own
# proxy container. Update LITELLM_URL env / DNS if the deployment moves.
#
# Services:
#   - open-webui: General purpose chat UI with RAG and web search
#   - sillytavern: Roleplay-focused UI with character cards
#   - lobe-chat: Modern chat UI with plugin support
#   - searxng: Privacy-focused metasearch engine for web search
#   - tool-host: FastAPI sidecar for the SDK tool-call loop

services:
  # ============================================
  # SearXNG - Web Search Engine
  # ============================================
  # Privacy-focused metasearch engine that aggregates results
  # from multiple search engines. Used by Open WebUI for web search.
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./config/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Tool Host - server-side execution for the SDK's tool / function-
  # calling loop. The browser-side @catalyst/llm-sdk dispatches each
  # tool_call here over HTTP; this service owns the actual side effects
  # (SearXNG queries, headless-browser fetches in Pass 2, future MCP
  # adapters) so the playground bundle doesn't have to ship a headless
  # browser or worry about CORS.
  # ============================================
  tool-host:
    build:
      context: ./packages/tool-host
      dockerfile: Dockerfile
    container_name: catalyst-tool-host
    restart: unless-stopped
    ports:
      - "127.0.0.1:7077:7077"
    environment:
      - SEARXNG_URL=http://searxng:8080
      # Comma-separated SearXNG engines — kept narrow to avoid rate
      # limits we'd hit fanning out to all 70+.
      - SEARXNG_ENGINES=google,bing,duckduckgo,brave,wikipedia,github
      # Set TOOL_HOST_API_KEY to enable bearer auth on the public
      # interface. Unset = open (fine on a private LAN).
      # - TOOL_HOST_API_KEY=changeme
    depends_on:
      - searxng
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7077/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================
  # Open WebUI - General Purpose Chat
  # ============================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:8080"
    volumes:
      - ./data/open-webui:/app/backend/data
    environment:
      # Connect via the deployed LiteLLM proxy for unified API access.
      # `host.docker.internal` resolves through the extra_hosts mapping
      # below, so this works regardless of which network the container
      # was launched on. Override with LITELLM_URL when the proxy moves.
      - OLLAMA_BASE_URL=${LITELLM_URL:-http://litellm.talos00}
      # Disable telemetry
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      # Auth settings
      - WEBUI_AUTH=true
      # API settings
      - ENABLE_OPENAI_API=false
      - ENABLE_OLLAMA_API=true
      # RAG settings
      - RAG_EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=100
      # Web Search via SearXNG
      - ENABLE_RAG_WEB_SEARCH=true
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
      - RAG_WEB_SEARCH_RESULT_COUNT=5
      - RAG_WEB_SEARCH_CONCURRENT_REQUESTS=5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - searxng
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================
  # SillyTavern - Roleplay & Character Chat
  # ============================================
  sillytavern:
    image: ghcr.io/sillytavern/sillytavern:latest
    container_name: sillytavern
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/sillytavern:/home/node/app/data
      - ./config/sillytavern-config.yaml:/home/node/app/config.yaml
    environment:
      - TZ=America/Los_Angeles
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================
  # LobeChat - Modern Chat UI with Plugins
  # ============================================
  # Feature-rich chat UI with plugin ecosystem, multi-model support,
  # and modern UX. Alternative to Open WebUI with different strengths.
  lobe-chat:
    image: lobehub/lobe-chat:latest
    container_name: lobe-chat
    restart: unless-stopped
    ports:
      - "127.0.0.1:3210:3210"
    volumes:
      - ./data/lobe-chat:/root/.lobe-chat
    environment:
      # Connect via the deployed LiteLLM proxy for unified API access.
      # Override with LITELLM_URL when the proxy moves.
      - OLLAMA_PROXY_URL=${LITELLM_URL:-http://litellm.talos00}
      # Enable Ollama as default provider
      - ENABLED_OLLAMA=1
      # Access code (optional - set for basic auth)
      # - ACCESS_CODE=your-access-code
      # Disable analytics
      - NEXT_TELEMETRY_DISABLED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # LiteLLM is intentionally NOT defined here — the proxy lives at
  # http://litellm.talos00 (talos k8s cluster). See the file header.
