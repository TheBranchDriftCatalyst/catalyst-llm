      api_base: "https://api.runpod.ai/v2/vvcncuivef9qzo/openai/v1"
      api_key: "$RUNPOD_API_KEY"

  # --- Ollama (Mac M3 Max Pro @ 192.168.1.85) ---
  - model_name: "ollama-mac/qwen3:30b-a3b"
    litellm_params:
      model: "ollama/qwen3:30b-a3b"
      api_base: "http://192.168.1.85:11434"
  - model_name: "ollama-mac/qwen2.5:32b"
