# git-cliff config for RunPod releases
# Only processes commits touching runpod/ files, tagged with runpod-v*

[changelog]
header = """
# Changelog\n
All notable changes to the RunPod inference pod.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="runpod-v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs", group = "Documentation" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^optimize", group = "Performance" },
    { message = "^default", group = "Miscellaneous" },
    { message = "^Initial", group = "Miscellaneous" },
    { body = ".*", group = "Other" },
]
tag_pattern = "runpod-v[0-9].*"
