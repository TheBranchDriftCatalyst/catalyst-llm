[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catalyst-contracts-core"
version = "0.1.0"
description = "Shared enums (MentionType, AlignmentType, ExtractionMethod) and Provenance base type for the extraction + knowledge-graph domain"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/catalyst_contracts_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "hypothesis>=6.152.8",
]
