[project]
name = "catalyst-tool-host"
version = "0.1.0"
description = "Sidecar service that executes catalyst-llm-sdk tool calls server-side (web_search, browse_page, ...)"
requires-python = ">=3.15.2"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.29.0",
    "pydantic>=2.14.4",
    # browse_page (Pass 2):
    # "playwright>=1.50",
    # "trafilatura>=2.0",   # readability-style extraction for browse_page
]

[dependency-groups]
dev = ["pytest>=9.2.0", "httpx>=0.29.0"]

[project.scripts]
tool-host = "tool_host.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_host"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
pythonpath = ["src"]
markers = [
    "unit: tests with no external deps (no network, no spawned services)",
    "integration: tests that hit the live tool-host HTTP surface",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Pyflakes only (F) — see catalyst-langgraph for rationale.
select = ["F"]
