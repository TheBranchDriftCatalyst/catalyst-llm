[project]
name = "catalyst-tool-host"
version = "0.1.0"
description = "Sidecar service that executes catalyst-llm-sdk tool calls server-side (web_search, browse_page, ...)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    # browse_page (Pass 2):
    # "playwright>=1.50",
    # "trafilatura>=2.0",   # readability-style extraction for browse_page
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
tool-host = "tool_host.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_host"]
