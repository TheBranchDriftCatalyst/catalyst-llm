version: "3"

# Contract docs + default + test alias come from the shared include.
# See taskfiles/test-contract.yml for the four-verb convention.

includes:
  contract:
    taskfile: ../../taskfiles/test-contract.yml
    flatten: true

tasks:
  test:lint:
    desc: "ruff (Pyflakes — F rules) — config in pyproject.toml [tool.ruff]"
    cmds:
      - uv run --with "ruff>=0.6" ruff check src/ tests/

  test:unit:
    desc: "pytest -m unit — no network, no spawned services"
    cmds:
      - mkdir -p .reports
      - uv run --with 'pytest>=8.0' --with 'fastapi>=0.115' --with 'httpx>=0.27' --with 'pydantic>=2.9' --with 'uvicorn>=0.32' pytest tests/ -m unit --junitxml=.reports/junit.xml -o junit_suite_name=tool-host

  # Full suite with junit XML; integration tier auto-runs when env is set
  # (tool-host's integration tests skipif when TOOL_HOST_URL env is unset).
  test:junit:
    desc: "All tests with junit XML; integration tier auto-runs when env vars are set"
    cmds:
      - mkdir -p .reports
      - uv run --with 'pytest>=8.0' --with 'fastapi>=0.115' --with 'httpx>=0.27' --with 'pydantic>=2.9' --with 'uvicorn>=0.32' pytest tests/ --junitxml=.reports/junit.xml -o junit_suite_name=tool-host

  test:smoke:
    desc: "Smoke against the live tool-host HTTP surface (server must be running on :7077)"
    cmds:
      - uv run --with 'pytest>=8.0' --with 'httpx>=0.27' pytest tests/ -m integration

  test:full:
    desc: "Full suite (unit + integration)"
    cmds:
      - uv run --with 'pytest>=8.0' --with 'fastapi>=0.115' --with 'httpx>=0.27' --with 'pydantic>=2.9' --with 'uvicorn>=0.32' pytest tests/
