[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:ollama]
command=ollama serve
autostart=%(ENV_ENABLE_OLLAMA)s
autorestart=true
stdout_logfile=/var/log/ollama.log
stderr_logfile=/var/log/ollama-err.log
priority=10

[program:whisper]
command=gunicorn --bind 0.0.0.0:8787 --workers 1 --timeout 300 --chdir /opt whisper_server:app
autostart=%(ENV_ENABLE_WHISPER)s
autorestart=true
stdout_logfile=/var/log/whisper.log
stderr_logfile=/var/log/whisper-err.log
priority=20

[program:comfyui]
command=/opt/scripts/run-comfyui.sh
autostart=%(ENV_ENABLE_COMFYUI)s
autorestart=true
stdout_logfile=/var/log/comfyui.log
stderr_logfile=/var/log/comfyui-err.log
startsecs=15
startretries=3
priority=30

[program:watchdog]
command=/opt/scripts/watchdog.sh
autostart=true
autorestart=true
stdout_logfile=/var/log/watchdog.log
stderr_logfile=/var/log/watchdog-err.log
priority=99
