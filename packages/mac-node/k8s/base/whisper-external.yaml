# Exposes the Mac's bare-metal Whisper API as a Kubernetes service.
# Dagster step pods and other cluster workloads can reach it at:
#   whisper-mac.mac-node.svc.cluster.local:8787
#
# OpenAI-compatible: POST /v1/audio/transcriptions
---
apiVersion: v1
kind: Endpoints
metadata:
  name: whisper-mac
  namespace: mac-node
  labels:
    app.kubernetes.io/name: whisper
    app.kubernetes.io/component: transcription
    app.kubernetes.io/part-of: mac-node
    node: mac-m3
subsets:
  - addresses:
      - ip: 192.168.1.200
    ports:
      - name: api
        port: 8787
        protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: whisper-mac
  namespace: mac-node
  labels:
    app.kubernetes.io/name: whisper
    app.kubernetes.io/component: transcription
    app.kubernetes.io/part-of: mac-node
    node: mac-m3
spec:
  ports:
    - name: api
      port: 8787
      targetPort: 8787
      protocol: TCP
