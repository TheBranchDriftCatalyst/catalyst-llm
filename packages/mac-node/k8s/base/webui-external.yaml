# Exposes the Mac's Open WebUI as a Kubernetes service.
# Accessible via IngressRoute at: http://webui-mac.talos00
# Also reachable in-cluster at: webui-mac.mac-node.svc.cluster.local:3000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: webui-mac
  namespace: mac-node
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: mac-node
    node: mac-m3
subsets:
  - addresses:
      - ip: 192.168.1.200  # Update to match your Mac's static IP
    ports:
      - name: http
        port: 8080
        protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: webui-mac
  namespace: mac-node
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: mac-node
    node: mac-m3
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 3000
      protocol: TCP
