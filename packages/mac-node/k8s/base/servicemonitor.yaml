# Optional: Prometheus ServiceMonitor to scrape Ollama metrics
# Requires prometheus-operator / kube-prometheus-stack in the Talos cluster
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ollama-mac
  namespace: mac-node
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: mac-node
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
      node: mac-m3
  endpoints:
    - port: api
      path: /api/tags
      interval: 60s
      scrapeTimeout: 10s
