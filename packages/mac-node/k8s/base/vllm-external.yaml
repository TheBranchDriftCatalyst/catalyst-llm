# Exposes the Mac's bare-metal vLLM-MLX as a Kubernetes service.
# Pods in the Talos cluster can reach it at:
#   vllm-mac.mac-node.svc.cluster.local:8000
#
# vLLM-MLX provides an OpenAI-compatible API with better throughput
# than Ollama for batched/multi-user serving.
---
apiVersion: v1
kind: Endpoints
metadata:
  name: vllm-mac
  namespace: mac-node
  labels:
    app.kubernetes.io/name: vllm-mlx
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: mac-node
    node: mac-m3
subsets:
  - addresses:
      - ip: 192.168.1.33  # Update to match your Mac's static IP
    ports:
      - name: api
        port: 8000
        protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-mac
  namespace: mac-node
  labels:
    app.kubernetes.io/name: vllm-mlx
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: mac-node
    node: mac-m3
spec:
  ports:
    - name: api
      port: 8000
      targetPort: 8000
      protocol: TCP
