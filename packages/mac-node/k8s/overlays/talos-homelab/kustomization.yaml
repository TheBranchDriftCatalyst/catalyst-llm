apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Patch the IP address if different from default
patches:
  - target:
      kind: Endpoints
      name: ollama-mac
    patch: |
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "192.168.1.33"
  - target:
      kind: Endpoints
      name: vllm-mac
    patch: |
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "192.168.1.33"
