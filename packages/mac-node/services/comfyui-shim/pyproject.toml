[project]
name = "comfyui-shim"
version = "0.1.0"
description = "OpenAI-compatible /v1/images/generations shim in front of a local ComfyUI instance"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "websockets>=13",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
comfyui-shim = "comfyui_shim.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfyui_shim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
