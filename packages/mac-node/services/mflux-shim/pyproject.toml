[project]
name = "mflux-shim"
version = "0.1.0"
description = "OpenAI-compatible /v1/images/generations shim that drives mflux (MLX-native FLUX) on a Mac M-series node"
requires-python = ">=3.12"
dependencies = [
    # mflux drives FLUX models on Apple Silicon via MLX. We pin a >= range
    # rather than exact since mflux ships frequent releases; if a release
    # breaks the shim, pin to the last known good in the lockfile.
    "mflux>=0.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
mflux-shim = "mflux_shim.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mflux_shim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
