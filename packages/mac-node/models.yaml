# Mac Node Model Registry
# Single source of truth for all models served on this node and RunPod.
# Used by: Taskfile, dashboard, litellm config, install-deps.sh, pull-models.sh
#
# Fields:
#   name:          Ollama tag to pull (required)
#   alias:         Short name for LiteLLM/dashboard (required)
#   extra_aliases: Additional LiteLLM model_names that route to this same backend.
#                  Used for stable routing names (e.g. "gemma4-vision") so
#                  consumers don't have to track engine/quant changes.
#   description:   What the model does (required)
#   tags:          Capability tags [chat, coding, reasoning, embedding, etc.]
#   target:        Where to install — [mac, runpod] (default: both)
#   category:      Grouping for pull scripts and docs
#
# ── Curation philosophy (May 2026) ────────────────────────────────────
# One model per category, picked from May 2026 SOTA leaderboards. We're
# fighting paradox-of-choice: the goal is *fewer, better* — not a zoo.
# When a new SOTA lands and proves itself, swap the alias here in one
# commit and gen-litellm.py rewrites the proxy config. Don't accumulate
# legacy entries — that's how we ended up with 30 mac-side models last
# pass, half of which weren't even pulled. See AGENTS.md for the
# capability-by-capability shortlist + drop log.
#
# ── Quant policy (M5 Max, 128GB unified memory) ───────────────────────
# Ollama defaults to Q4_K_M, which is conservative for our box. We
# size up per architecture class:
#
#   MoE (qwen3-coder, gemma4-26b, qwen3-moe-uncensored)  → Q8_0 / Q6_K
#       Only the active path runs per token (3-4B), so Q8 is ~5-10%
#       slower than Q4. Trivial cost for measurable quality.
#
#   Dense reasoning (deepseek-r1, qwen3-coder-opus)      → Q8_0
#       Quant noise compounds across CoT chains. Pays a real speed
#       tax (~30-40%) but the quality win on multi-step reasoning
#       is worth it. Expect ~7-9 tok/s instead of ~12.
#
#   Dense small (phi4 14B, cydonia 24B)                  → Q8_0
#       Small enough that Q8 is essentially free. Use it.
#
#   Dense 70B class (hermes-4)                            → Q5_K_M
#       Sweet spot once you account for KV cache headroom on long
#       sessions. Q6 is viable, Q4 leaves quality on the table.
#
#   Dense 72B finetune (magnum-v4)                        → Q5_K_M
#       Same logic as 70B class.
#
#   Dense 123B (behemoth-x)                               → Q4_K_M
#       Stays at Q4. ~73GB already; Q5 (~85GB) crowds the KV cache
#       budget on long-form sessions.
#
#   Specialty (embeddings, fast dailies, vision routers)  → default
#       gemma4:e4b stays Q4 because speed is the whole point.
#       qwen3-embedding stays default — quant doesn't matter for
#       embeddings the way it does for generation.
#
# imatrix (i1) repos from mradermacher top out at Q6_K. At Q8 the
# imatrix calibration gains are marginal anyway, so prefer i1-Q6_K
# over the static-quant Q8_0 sibling for those models.

node:
  ip: "192.168.1.33"
  chip: "M5 Max"

# ─── Image generation (OpenAI-compat shim on the mac node) ──────────
# Two shims live in packages/mac-node/services/, both speaking the same
# OpenAI /v1/images/generations contract on shim_port. Pick one via the
# `engine` field below — gen-litellm.py adjusts the description label
# but otherwise generates identical entries.
#
#   engine: mflux    — MLX-native (filipstrand/mflux), one model in
#                      memory at a time, 12-18s/image on M5 Max. May
#                      2026 SOTA pick (FLUX.1 Krea Dev). DEFAULT.
#   engine: comfyui  — ComfyUI workflows behind a thin shim. Use when
#                      you need LoRA stacks / custom workflows.
#
# To bring the active shim up on the mac node:
#   cd packages/mac-node/services/mflux-shim && uv sync
#   sed "s|__SHIM_HOME__|$(pwd)|g; s|__VENV__|$(pwd)/.venv|g" \
#     ../../launchd/com.mflux-shim.plist \
#     > ~/Library/LaunchAgents/com.mflux-shim.plist
#   launchctl load ~/Library/LaunchAgents/com.mflux-shim.plist
#
# After: the shim answers on http://192.168.1.33:8012 and LiteLLM
# routes /v1/images/generations through it for `mac/flux-krea`.
image_gen:
  engine: mflux
  shim_port: 8012
  comfyui_port: 8188   # only used when engine: comfyui
  pipelines:
    - name: dev-krea
      alias: flux-krea
      description: "FLUX.1 Krea Dev — May 2026 SOTA personal-use image-gen, MLX-native via mflux (~12-18s/image on M5 Max, 1024² @ 20 steps, Q8)"
      tags: [image_gen, flux, sota-may-2026]

ollama:
  port: 11434

  # Custom modelfiles to create after pulling
  modelfiles: []

  models:
    # ── Mac-side curation (May 2026 SOTA — one per category) ───
    # Drop log lives in AGENTS.md. The headline removals were:
    #  - Coding: dropped qwen2.5-coder + devstral; qwen3-coder:30b wins.
    #  - Vision: kept gemma4 family for now (vision is still being
    #    rolled out via Ollama for qwen3-vl); will add qwen3-vl when
    #    pulled and verified, then re-evaluate gemma4.
    #  - Reasoning: dropped 7B distill; only deepseek-r1:32b (the sweet
    #    spot on a 128GB M5 Max) remains.
    #  - Embeddings: kept only qwen3-embedding:8b (#1 MTEB
    #    multilingual at 70.58); the 9-model embedding zoo is gone.
    #  - Chat dailies: dropped llama3.x, mistral, mistral-nemo,
    #    dolphin*, gemma3-*, qwen2.5-7b — phi4 + gemma4 are enough.
    #  - Extraction: dropped nuextract1.5 + universalner; nuextract2
    #    subsumes both.

    # ── Coding + Tool calling ────────────────────────────────────
    # Quant policy on a 128GB M5 Max: prefer Q8_0 for MoE-A3B (3B
    # active path → ~5-10% slowdown vs Q4, marginal in practice).
    # Q4_K_M is the Ollama default but leaves quality on the table
    # we have memory for. See AGENTS.md for the full quant matrix.
    - name: qwen3-coder:30b-a3b-q8_0
      alias: qwen3-coder
      description: "Qwen3-Coder 30B-A3B MoE @ Q8_0 (~33GB) — 256K ctx, ~Sonnet 4.5-class agentic coding, BFCL v3 top tier. Q8 over Q4 because MoE active path is small and we have the memory."
      tags: [coding, moe, function-calling]
      category: serving

    # Qwen3 8B — small, fast, the most-stable Ollama tool-caller in
    # its size class. Docker's local-tool-calling eval gives it F1
    # 0.933 with ~half the latency of the 14B variant; community
    # consensus is "rarely hallucinates calls or drops parameters".
    # Ideal council member when council_size > 1: small enough to
    # run multiple instances in parallel on the M5 Max without
    # serialising on the GPU, fast enough to keep loop wall-clock
    # short. Keep at Ollama default Q4_K_M — Qwen3 dense models
    # don't benefit much from Q8 at 8B and the speed win matters
    # more here than the marginal quality bump.
    - name: qwen3:8b
      alias: qwen3-8b
      description: "Qwen3 8B (general chat) @ Q4_K_M (default) — small, fast, most-stable Ollama tool-caller in its size class (F1 0.933 on Docker's local-tool-use eval; rarely hallucinates calls). Ideal council member when council_size ≥ 2 — sub-second per turn on M5 Max, leaves headroom for parallel members."
      tags: [chat, function-calling]
      category: serving

    # GLM-4.5 Air — top open-weight BFCL tier (~76.7% v3) alongside
    # Qwen3-32B, but the MoE-A12B design keeps wall-clock close to a
    # 14B dense at full quality. Trained as an agentic generalist;
    # structured-output reliability is good under our streaming=off
    # gate.
    #
    # Q4_K_M ~62GB which fits with KV headroom on 128GB unified
    # memory. Sharded across multiple files on HF (over the 50GB
    # single-file limit), so the direct `hf.co/...:tag` form 404s
    # on `ollama pull manifest`. Use the merge-gguf strategy —
    # download-models.py grabs the shards, runs llama-gguf-split
    # --merge, then `ollama create glm-4.5-air:Q4_K_M`. Same path
    # behemoth-x / qwen3-coder-opus already exercise.
    - name: glm-4.5-air:Q4_K_M
      alias: glm-4.5-air
      description: "GLM-4.5 Air 106B-A12B MoE @ Q4_K_M (~62GB, 12B active) — top open-weight BFCL v3 tier (~76.7%). MoE keeps wall-clock close to a 14B dense at full quality. Agentic-generalist trained — strong tool calling under streaming=off. ChatML."
      tags: [chat, function-calling, moe, reasoning]
      category: serving
      target: [mac]
      pull:
        strategy: merge-gguf
        hf_repo: "unsloth/GLM-4.5-Air-GGUF"
        hf_pattern: "*Q4_K_M*.gguf"
        template_from: chatml

    # ── Coding (Opus-distilled variants) ─────────────────────────
    # Two siblings to qwen3-coder above — same Qwen3-Coder-Next base,
    # SFT'd on Opus-4.6 / Claude-4.5-Opus high-reasoning traces. They
    # trade some BFCL/agentic edge for noticeably more deliberate
    # multi-step planning ("thinks like Opus"). Both are sharded /
    # community-mirror GGUFs that Ollama can't pull directly
    # (ollama/ollama#5245), so we use the merge-gguf strategy that
    # download-models.py already implements for behemoth-x +
    # qwen3-moe-uncensored — `hf download` shards, optional
    # `llama-gguf-split --merge`, then `ollama create`.
    #
    # Picks rationale (May 2026):
    #   - samuelcardillo's repo is the community-blessed clean SFT
    #     pick (37 likes, full-finetune, three reasoning datasets).
    #   - mradermacher's Huihui-abliterated + imatrix variant is the
    #     uncensored sibling — same recipe, fewer refusals, slightly
    #     higher-quality quants at the same bit width.
    # ChatML; temp 0.6 / min_p 0.05 / rep_pen 1.02 (prefer the lower
    # temp than RP defaults — these are reasoning models).
    # IMPORTANT: Qwen3-Coder-Next is ~80B class (NOT 30B). Verified
    # against HF file sizes: Q4_K_M=48GB, Q5_K_M=57GB, Q6_K=65GB,
    # Q8_0=85GB, BF16=159GB. Both Opus-distilled coding entries land
    # at Q6_K — the mradermacher i1 sibling caps at Q6_K, and the
    # samuelcardillo Q8_0 has a verifiably broken CAS chunk in HF's
    # storage that wedges hf-download on the last ~130MB (2x reproduced
    # 2026-05-10). Q6_K is the sweet spot anyway: noticeable quality
    # bump over Q4_K_M without the Q8 tail-fetch lottery, and ~65GB
    # leaves plenty of KV headroom on 128GB unified memory.
    - name: qwen3-coder-opus:Q6_K
      alias: qwen3-coder-opus
      description: "Qwen3-Coder-Next (~80B base) + Opus-4.6 reasoning distill (samuelcardillo, full SFT) @ Q6_K (~65GB) — Opus-style multi-step planning. Reasoning distills benefit from higher quants (CoT noise compounds). ChatML; temp 0.6."
      tags: [coding, reasoning, distillation, claude-opus]
      category: serving
      target: [mac]
      pull:
        strategy: merge-gguf
        hf_repo: "samuelcardillo/Qwen3-Coder-Next-Opus-4.6-Reasoning-Distilled-GGUF"
        hf_pattern: "*Q6_K*.gguf"
        template_from: chatml
      parameters:
        temperature: 0.6
        min_p: 0.05
        repeat_penalty: 1.02

    - name: qwen3-coder-opus-uncensored:i1-Q6_K
      alias: qwen3-coder-opus-uncensored
      description: "Huihui-Qwen3-Coder-Next-Opus-4.6 abliterated (mradermacher i1) @ Q6_K (~65GB) — uncensored sibling of qwen3-coder-opus. Same Opus-distilled reasoning, fewer refusals, imatrix-calibrated. ChatML; temp 0.6."
      tags: [coding, reasoning, distillation, claude-opus, uncensored]
      category: serving
      target: [mac]
      pull:
        strategy: merge-gguf
        hf_repo: "mradermacher/Huihui-Qwen3-Coder-Next-Opus-4.6-Reasoning-Distilled-abliterated-i1-GGUF"
        hf_pattern: "*i1-Q6_K.gguf"
        template_from: chatml
      parameters:
        temperature: 0.6
        min_p: 0.05
        repeat_penalty: 1.02

    # ── Reasoning ────────────────────────────────────────────────
    # Dense 32B — Q8 pays a real speed tax (~30-40% vs Q4) but
    # reasoning chains amplify quant noise across many tokens, so the
    # quality win is worth it. Expect ~7-9 tok/s at Q8 vs ~11-14 at Q4.
    - name: deepseek-r1:32b-qwen-distill-q8_0
      alias: deepseek-r1
      description: "DeepSeek R1 Distill Qwen 32B @ Q8_0 (~34GB) — beats o1-mini on math/code reasoning. ~7-9 tok/s on M5 Max. Q8 over Q4 because CoT amplifies quant noise."
      tags: [reasoning]
      category: serving

    # ── Vision (multimodal) ──────────────────────────────────────
    # Gemma4 vision via Ollama until qwen3-vl is pulled and verified.
    # When you pull qwen3-vl, demote gemma4-26b's extra_aliases below.
    - name: gemma4:26b-a4b-it-q8_0
      alias: gemma4-26b
      extra_aliases: [gemma4-vision]
      description: "Gemma 4 26B-A4B MoE @ Q8_0 (~28GB, multimodal + thinking). Vision routing alias for the playground until qwen3-vl is pulled and verified. MoE → Q8 cost is small."
      tags: [chat, vision, moe]
      category: serving

    # gemma4 E4B stays at default (Q4_K_M) — its whole job is fast
    # vision-capable daily; bumping it would defeat the purpose.
    - name: gemma4:e4b
      alias: gemma4
      description: "Gemma 4 E4B MoE (multimodal + thinking) — fast vision-capable daily. Kept at Ollama default (Q4_K_M) because speed is the whole point."
      tags: [chat, vision, moe]
      category: serving

    # ── Daily chat (general purpose, fast on M5 Max) ───────────
    - name: phi4:14b-q8_0
      alias: phi4
      description: "Phi-4 14B @ Q8_0 (~16GB) — punches above its weight, default daily driver under 14B. Q8 because at this size it costs nothing."
      tags: [chat, reasoning]
      category: serving

    # ── Uncensored RP / creative writing (May 2026 top 5) ────────
    # Curated for A/B testing in the playground compare view —
    # picked to span the quality/speed tradeoff space:
    #   1. Behemoth-X 123B   — long-form literary champion (slow, ~73GB)
    #   2. Hermes-4 70B      — daily-driver, smartest baseline
    #   3. Cydonia 24B v4.3  — fast 24B-class daily for RP
    #   4. Qwen3-MoE 30B-A3B — MoE wildcard (small-model speed, 30B breadth)
    #   5. Magnum v4 72B     — explicit / Claude-prose specialist
    #
    # Drop log: wizardlm-uncensored (Llama-2-era, dwarfed); Midnight Miqu /
    # Lumimaid / Llama 4 (superseded or low community signal).
    #
    # Sampler cheat sheet for all five — prose-heavy: temp 0.85, min_p 0.05,
    # rep_pen 1.03; tight RP: temp 1.0, min_p 0.05, rep_pen 1.05. Avoid
    # rep_pen >1.10 (kills prose rhythm) and temp <0.6 (AI-tell vocab loops).

    # NOTE: Behemoth-X-123B Q4_K_M is ~73GB and is therefore SHARDED
    # on HuggingFace (single-GGUF cap is ~50GB). Ollama can't pull
    # sharded GGUFs directly (ollama/ollama#5245), so this entry uses
    # the merge-gguf pull strategy: scripts/download-models.py grabs
    # the shards from HF, runs `llama-gguf-split --merge`, and then
    # `ollama create`s the resulting single-file model under the
    # local tag `behemoth-x:Q4_K_M`.
    #
    # Operator prereqs (one-time on the mac node):
    #   brew install llama.cpp           # provides llama-gguf-split
    #   pip install huggingface_hub      # `hf` CLI (or use `huggingface-cli`)
    # Disk: needs ~150GB scratch during merge (shards + merged copy);
    # cleanup runs after `ollama create` succeeds.
    - name: behemoth-x:Q4_K_M
      alias: behemoth-x
      description: "Behemoth-X 123B v2 (Mistral Large 2411 finetune) — long-form literary champion; stable prose to ~19k tokens. Use Metharme/Mistral system tokens; min_p 0.05."
      tags: [chat, uncensored, rp, creative, literary]
      category: rp
      target: [mac]
      pull:
        strategy: merge-gguf
        hf_repo: "TheDrummer/Behemoth-X-123B-v2-GGUF"
        hf_pattern: "*Q4_K_M*.gguf"
        # Mistral Large 2411 = v7 Tekken format (with [SYSTEM_PROMPT] tag).
        template_from: mistral-v7
      parameters:
        # Long-form-prose end of the RP cheat sheet — see header
        # comment above (temp 0.85, min_p 0.05, rep_pen 1.03).
        temperature: 0.85
        min_p: 0.05
        repeat_penalty: 1.03

    # Hermes-4 70B — bumped to Q5_K_M (~50GB) from Q4 (~42GB).
    # Dense 70B; Q6_K (~58GB) is also viable but Q5_K_M is the
    # sweet spot once you account for KV cache headroom on long
    # creative-writing sessions.
    - name: "hf.co/unsloth/Hermes-4-70B-GGUF:Q5_K_M"
      alias: hermes-4-70b
      description: "Hermes-4 70B (Llama 3.1 70B base) @ Q5_K_M (~50GB) — top RefusalBench, hybrid <think> toggle, lowest AI-tells baseline. Toggle reasoning OFF for prose. ChatML."
      tags: [chat, uncensored, rp, creative, reasoning]
      category: rp
      target: [mac]

    # Cydonia 24B — bumped to Q8_0 (~26GB) from Q5_K_M (~16GB).
    # At this size Q8 is essentially free; the model is already
    # advertised as a "fast daily" so we want it punching at its
    # actual quality ceiling.
    - name: "hf.co/TheDrummer/Cydonia-24B-v4.3-GGUF:Q8_0"
      alias: cydonia-24b
      description: "Cydonia 24B v4.3 (Mistral Small 3.2 base, Dec 2025) @ Q8_0 (~26GB) — Drummer's most-improved-prose release; fast 24B daily for RP. Mistral v7 Tekken template; temp 1.0 / min_p 0.05 / rep_pen 1.03."
      tags: [chat, uncensored, rp, creative]
      category: rp
      target: [mac]

    # NOTE: the original DavidAU repo has no -GGUF sibling (only safetensors).
    # The community quant lives at mradermacher/...-i1-GGUF (imatrix-
    # calibrated quants — a touch higher quality than vanilla Q4_K_M
    # at the same bit width). Single-file at this size (17.3 GB), so
    # the merge-gguf path skips llama-gguf-split and just feeds the
    # file straight into `ollama create`.
    - name: qwen3-moe-uncensored:i1-Q6_K
      alias: qwen3-moe-uncensored
      description: "Qwen3-30B-A3B MoE @ i1-Q6_K (~25GB, 3B active) — heretic-abliterated Claude-4.5-Opus reasoning distill. MoE wildcard — small-model speeds with 30B breadth. Reasoning distill → Q6 over Q4 to preserve CoT fidelity. ChatML; temp 0.7."
      tags: [chat, uncensored, rp, creative, moe]
      category: rp
      target: [mac]
      pull:
        strategy: merge-gguf
        hf_repo: "mradermacher/Qwen3-30B-A3B-Claude-4.5-Opus-High-Reasoning-2507-ABLITERATED-UNCENSORED-V2-i1-GGUF"
        hf_pattern: "*i1-Q6_K.gguf"
        template_from: chatml
      parameters:
        # Reasoning distill → temp 0.7 (per description), slightly
        # lower rep_pen because RP prose breathes more.
        temperature: 0.7
        min_p: 0.05
        repeat_penalty: 1.03

    # Magnum v4 72B — bumped to Q5_K_M (~52GB) from Q4_K_M (~41GB).
    # Sharded either way; merge-gguf flow handles both.
    - name: magnum-v4:Q5_K_M
      alias: magnum-v4
      description: "Magnum v4 72B (Qwen2.5 72B finetune) @ Q5_K_M (~52GB) — gold standard for explicit + literary craft prose voice. ChatML; 16k context (shorter); temp 1.0 / min_p 0.1."
      tags: [chat, uncensored, rp, creative, explicit]
      category: rp
      target: [mac]
      pull:
        strategy: merge-gguf
        hf_repo: "anthracite-org/magnum-v4-72b-gguf"
        hf_pattern: "*Q5_K_M*.gguf"
        # Qwen2.5 72B base = ChatML.
        template_from: chatml
      parameters:
        # Creative-prose sampler from description (temp 1.0 / min_p 0.1).
        # 16k native ctx capped via num_ctx.
        temperature: 1.0
        min_p: 0.1
        repeat_penalty: 1.03
        num_ctx: 16384

    # ── Structured extraction (specialist family) ────────────────
    # nuextract2 is the generalist; we also keep nuextract1.5 and
    # universalner because they're each trained on a *different*
    # specialist task (template-based JSON fill vs zero-shot NER) and
    # downstream code may have prompts hardcoded against the older
    # input shapes. Cheap to keep, painful to lose.
    # NOTE: these three community Ollama tags lost their upstream
    # manifest (was a community upload that's been removed from the
    # Ollama library). They're already pulled locally and serve fine
    # via the proxy, but `ollama pull` for a fresh refresh now 404s.
    # Marked `pull.strategy: local-only` so models:download verifies
    # they exist on disk and skips the network round-trip.
    - name: nuextract2:latest
      alias: nuextract2
      description: "NuExtract-2.0-8B (Qwen2.5-VL based) — beats GPT-4.1 by +9 F-score on schema extraction. Generalist extractor."
      tags: [extraction, vision]
      category: serving
      pull:
        strategy: local-only

    - name: nuextract1.5:latest
      alias: nuextract1.5
      description: "NuExtract 1.5 — template-based JSON fill (### Template / ### Text shape). Kept for legacy prompts."
      tags: [extraction]
      category: serving
      pull:
        strategy: local-only

    - name: universalner:latest
      alias: universalner
      description: "UniversalNER 7B — zero-shot named-entity recognition (\"What describes <type> in the text?\"). Specialist for ad-hoc NER."
      tags: [extraction, ner]
      category: serving
      pull:
        strategy: local-only

    # ── Embedding ────────────────────────────────────────────────
    - name: qwen3-embedding:8b
      alias: qwen3-embed-8b
      description: "Qwen3 Embedding 8B — #1 MTEB multilingual at 70.58, 100+ langs, dims 32-4096. The single embedding model we need."
      tags: [embedding]
      category: embedding

    # ── Vision SOTA ──────────────────────────────────────────────
    # Two tiers, pick by latency budget:
    #   - qwen3-vl       (2B latest)    → fast OCR / quick "what's in
    #                                      this screenshot" — ~6GB,
    #                                      sub-second on M5 Max.
    #   - qwen3-vl-think (30B-A3B Q8)   → heavyweight vision reasoning
    #                                      with <think> traces — ~33GB,
    #                                      MoE so 3B active path keeps
    #                                      it usable. Use for charts,
    #                                      multi-step doc analysis,
    #                                      visual planning.
    # The playground's vision routing alias (gemma4-vision) lives on
    # gemma4-26b for now; once qwen3-vl-think is verified, move
    # extra_aliases: [vision] over here.
    - name: qwen3-vl:latest
      alias: qwen3-vl
      description: "Qwen3-VL 2B (latest) — fast OCR + visual QA, beats InternVL3 on DocVQA / OS-World at this size. Sub-second on M5 Max for screenshot-class tasks."
      tags: [vision, ocr, chat]
      category: serving

    - name: qwen3-vl:30b-a3b-thinking-q8_0
      alias: qwen3-vl-think
      description: "Qwen3-VL 30B-A3B Thinking @ Q8_0 (~33GB, 3B active) — heavyweight vision reasoning with <think> traces. For charts, multi-step doc analysis, visual planning. MoE keeps it usable on M5 Max."
      tags: [vision, ocr, chat, reasoning, moe]
      category: serving
      target: [mac]

    # ── Heavyweight: 70B+ (RunPod only — proxy entries skipped on mac) ───
    # These don't register in the LiteLLM proxy (gen-litellm.py filters
    # `target: [runpod]` out of the mac config splice). Kept as a
    # registry for future runpod brings-up.

