# Mac Node Model Registry
# Single source of truth for all models served on this node and RunPod.
# Used by: Taskfile, dashboard, litellm config, install-deps.sh, pull-models.sh
#
# Fields:
#   name:          Ollama tag to pull (required)
#   alias:         Short name for LiteLLM/dashboard (required)
#   extra_aliases: Additional LiteLLM model_names that route to this same backend.
#                  Used for stable routing names (e.g. "gemma4-vision") so
#                  consumers don't have to track engine/quant changes.
#   description:   What the model does (required)
#   tags:          Capability tags [chat, coding, reasoning, embedding, etc.]
#   target:        Where to install — [mac, runpod] (default: both)
#   category:      Grouping for pull scripts and docs
#
# ── Curation philosophy (May 2026) ────────────────────────────────────
# One model per category, picked from May 2026 SOTA leaderboards. We're
# fighting paradox-of-choice: the goal is *fewer, better* — not a zoo.
# When a new SOTA lands and proves itself, swap the alias here in one
# commit and gen-litellm.py rewrites the proxy config. Don't accumulate
# legacy entries — that's how we ended up with 30 mac-side models last
# pass, half of which weren't even pulled. See AGENTS.md for the
# capability-by-capability shortlist + drop log.

node:
  ip: "192.168.1.33"
  chip: "M5 Max"

# ─── Image generation (ComfyUI + OpenAI shim) ───────────────────────
# The shim speaks OpenAI-compatible /v1/images/generations and forwards
# to a local ComfyUI instance.
#
# DISABLED — comfyui-shim is not running and the LiteLLM entries were
# returning 500s on every call. May 2026 SOTA pick is FLUX.1 Krea Dev
# via mflux (MLX-native, github.com/filipstrand/mflux); when bringing
# image gen back up, prefer that over a comfyui workflow round-trip.
# To re-enable: bring the shim up on port 8012 (see
# packages/mac-node/services/comfyui-shim/), restore a `pipelines:`
# entry, and rerun gen-litellm.py.
image_gen:
  shim_port: 8012
  comfyui_port: 8188
  pipelines: []

ollama:
  port: 11434

  # Custom modelfiles to create after pulling
  modelfiles: []

  models:
    # ── Mac-side curation (May 2026 SOTA — one per category) ───
    # Drop log lives in AGENTS.md. The headline removals were:
    #  - Coding: dropped qwen2.5-coder + devstral; qwen3-coder:30b wins.
    #  - Vision: kept gemma4 family for now (vision is still being
    #    rolled out via Ollama for qwen3-vl); will add qwen3-vl when
    #    pulled and verified, then re-evaluate gemma4.
    #  - Reasoning: dropped 7B distill; only deepseek-r1:32b (the sweet
    #    spot on a 128GB M5 Max) remains.
    #  - Embeddings: kept only qwen3-embedding:8b (#1 MTEB
    #    multilingual at 70.58); the 9-model embedding zoo is gone.
    #  - Chat dailies: dropped llama3.x, mistral, mistral-nemo,
    #    dolphin*, gemma3-*, qwen2.5-7b — phi4 + gemma4 are enough.
    #  - Extraction: dropped nuextract1.5 + universalner; nuextract2
    #    subsumes both.

    # ── Coding + Tool calling ────────────────────────────────────
    - name: qwen3-coder:30b
      alias: qwen3-coder
      description: "Qwen3-Coder 30B-A3B MoE — 256K ctx, ~Sonnet 4.5-class agentic coding, BFCL v3 top tier (function calling). Replaces qwen2.5-coder + devstral."
      tags: [coding, moe, function-calling]
      category: serving

    # ── Reasoning ────────────────────────────────────────────────
    - name: deepseek-r1:32b
      alias: deepseek-r1
      description: "DeepSeek R1 Distill Qwen 32B — beats o1-mini on math/code reasoning, ~18-20GB Q4_K_M, 11-14 tok/s on M5 Max. The reasoning local sweet spot."
      tags: [reasoning]
      category: serving

    # ── Vision (multimodal) ──────────────────────────────────────
    # Gemma4 vision via Ollama until qwen3-vl is pulled and verified.
    # When you pull qwen3-vl, demote gemma4-26b's extra_aliases below.
    - name: gemma4:26b
      alias: gemma4-26b
      extra_aliases: [gemma4-vision]
      description: "Gemma 4 26B-A4B MoE (multimodal + thinking, Q4_K_M). Vision routing alias for the playground until qwen3-vl is pulled and verified."
      tags: [chat, vision, moe]
      category: serving

    - name: gemma4:e4b
      alias: gemma4
      description: "Gemma 4 E4B MoE (multimodal + thinking) — fast vision-capable daily."
      tags: [chat, vision, moe]
      category: serving

    # ── Daily chat (general purpose, fast on M5 Max) ───────────
    - name: phi4:14b
      alias: phi4
      description: "Phi-4 14B — punches above its weight, default daily driver under 14B."
      tags: [chat, reasoning]
      category: serving

    # ── Uncensored ───────────────────────────────────────────────
    - name: wizardlm-uncensored:13b
      alias: wizardlm-uncensored
      description: "WizardLM 13B — classic abliterated; nothing newer beat it for uncensored 13B-class as of May 2026."
      tags: [chat, uncensored]
      category: serving

    # ── Structured extraction (specialist family) ────────────────
    # nuextract2 is the generalist; we also keep nuextract1.5 and
    # universalner because they're each trained on a *different*
    # specialist task (template-based JSON fill vs zero-shot NER) and
    # downstream code may have prompts hardcoded against the older
    # input shapes. Cheap to keep, painful to lose.
    - name: nuextract2:latest
      alias: nuextract2
      description: "NuExtract-2.0-8B (Qwen2.5-VL based) — beats GPT-4.1 by +9 F-score on schema extraction. Generalist extractor."
      tags: [extraction, vision]
      category: serving

    - name: nuextract1.5:latest
      alias: nuextract1.5
      description: "NuExtract 1.5 — template-based JSON fill (### Template / ### Text shape). Kept for legacy prompts."
      tags: [extraction]
      category: serving

    - name: universalner:latest
      alias: universalner
      description: "UniversalNER 7B — zero-shot named-entity recognition (\"What describes <type> in the text?\"). Specialist for ad-hoc NER."
      tags: [extraction, ner]
      category: serving

    # ── Embedding ────────────────────────────────────────────────
    - name: qwen3-embedding:8b
      alias: qwen3-embed-8b
      description: "Qwen3 Embedding 8B — #1 MTEB multilingual at 70.58, 100+ langs, dims 32-4096. The single embedding model we need."
      tags: [embedding]
      category: embedding

    # ── Vision SOTA ──────────────────────────────────────────────
    - name: qwen3-vl:latest
      alias: qwen3-vl
      description: "Qwen3-VL — beats InternVL3 on DocVQA / OS-World, 32-language OCR, robust to blur/tilt. May 2026 vision SOTA for local."
      tags: [vision, ocr, chat]
      category: serving

    # ── Heavyweight: 70B+ (RunPod only — proxy entries skipped on mac) ───
    # These don't register in the LiteLLM proxy (gen-litellm.py filters
    # `target: [runpod]` out of the mac config splice). Kept as a
    # registry for future runpod brings-up.

    - name: llama3.3:70b
      alias: llama3.3
      description: "Meta's best open model — strong structured output"
      tags: [chat, reasoning]
      category: heavyweight
      target: [runpod]

    - name: qwen2.5:72b-instruct
      alias: qwen2.5-72b
      description: "72B, elite structured output + extraction"
      tags: [chat, reasoning]
      category: heavyweight
      target: [runpod]

    - name: deepseek-r1:70b
      alias: deepseek-r1-70b
      description: Best open reasoning model at scale
      tags: [reasoning]
      category: heavyweight
      target: [runpod]

    - name: mistral-large:latest
      alias: mistral-large
      description: "Mistral's flagship, 123B"
      tags: [chat, reasoning]
      category: heavyweight
      target: [runpod]

    - name: gemma3:27b
      alias: gemma3-27b
      description: Step up from 12B benchmark tier
      tags: [chat]
      category: heavyweight
      target: [runpod]

    - name: qwen2.5-coder:32b
      alias: qwen2.5-coder-32b
      description: Strongest open coding model
      tags: [coding]
      category: heavyweight
      target: [runpod]

    - name: command-r:35b
      alias: command-r
      description: "Cohere's RAG-optimized model"
      tags: [chat, rag]
      category: heavyweight
      target: [runpod]

    # ── MoE 200B+: quantized monsters (RunPod only) ──────────────

    - name: qwen3:235b-a22b
      alias: qwen3-235b
      description: "235B MoE (22B active), rivals GPT-4o — fits 1x A100 80GB"
      tags: [chat, reasoning, moe]
      category: moe-200b
      target: [runpod]

    - name: qwen3.5:122b-a10b
      alias: qwen3.5-122b
      description: "122B MoE (10B active), ~25GB Q4"
      tags: [chat, moe]
      category: moe-200b
      target: [runpod]

    # ── OBSCENE: multi-GPU required (RunPod only) ────────────────

    - name: llama3.1:405b
      alias: llama3.1-405b
      description: "Meta's largest — the open-source GPT-4 class (~230GB Q4)"
      tags: [chat, reasoning]
      category: obscene
      target: [runpod]

    - name: deepseek-v3:671b
      alias: deepseek-v3
      description: "671B MoE (37B active), frontier-class reasoning (~400GB Q4)"
      tags: [reasoning, moe]
      category: obscene
      target: [runpod]

    - name: qwen2.5:110b
      alias: qwen2.5-110b
      description: "Alibaba's largest dense model (~63GB Q4)"
      tags: [chat, reasoning]
      category: obscene
      target: [runpod]

    - name: command-r-plus:104b
      alias: command-r-plus
      description: "Cohere's largest — RAG monster (~60GB Q4)"
      tags: [chat, rag]
      category: obscene
      target: [runpod]

    - name: falcon3:180b
      alias: falcon3
      description: "TII's flagship (~100GB Q4)"
      tags: [chat]
      category: obscene
      target: [runpod]

# ─── vLLM-MLX (DISABLED — all instances were dead in the May 2026 audit) ─
# All five MLX servers (devstral 8000, deepseek-r1 8001, qwen3 8002,
# qwen-coder 8003, nuextract 8004) were unreachable or 404'ing during
# the registry health check. The Ollama-routed equivalents above cover
# every workload, with strictly better SOTA picks (qwen3-coder:30b,
# deepseek-r1:32b, nuextract2). When MLX serving is worth the
# operational cost again — likely once mlx-vlm/vllm-mlx land their
# multi-thread fix (see Blaizzy/mlx-vlm#1134, waybarrios/vllm-mlx#496),
# both tracked as of May 2026 — restore an `instances:` list here and
# rerun gen-litellm.py.
vllm:
  instances: []
