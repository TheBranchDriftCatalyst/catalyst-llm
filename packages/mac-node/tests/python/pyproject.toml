[project]
name = "mac-node-tests"
version = "0.1.0"
description = "Parametrized pytest suite for mac-node + LiteLLM model coverage"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-v --strict-markers"
markers = [
    "chat: chat completion tests",
    "vision: vision/multimodal tests",
    "embedding: embedding tests",
    "mac: tests that hit the mac node directly",
    "litellm: tests that hit the LiteLLM proxy",
    "slow: tests that take >5s",
    "unit: tests with no external deps (currently none — every model test hits ollama)",
    "integration: tests that touch local services (chat/vision/embedding all qualify)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F"]
