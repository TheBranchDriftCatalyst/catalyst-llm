[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catalyst-langgraph"
version = "0.3.0"
description = "LangGraph-based agent service for Catalyst — wraps LiteLLM, calls tool-host, streams typed events to UIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Catalyst Team" }
]

dependencies = [
    "langchain-openai>=0.1.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.2.0",
    "httpx>=0.24.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.7.0",
    # DuckDB powers the event trace store — every yielded SSE event is
    # async-written to a queryable file so we can debug runaway loops,
    # measure cost-per-run, and (eventually) replay individual steps.
    # Modelled on langgraph-dev's api/app/persistence/event_store.py.
    "duckdb>=1.0.0",
    # Per-node Pydantic config schemas + extraction-domain models live
    # in catalyst-exgraph. agents/extraction.py imports them at module
    # load via the auto-import in agents/__init__.py. Path-source in
    # dev; build into a wheel when we set up a private PyPI.
    "catalyst-exgraph",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Property-based testing — used by tests/test_amr_parser_qa.py to
    # fuzz invariants on the AmrParserClient splitter/offset bookkeeping.
    "hypothesis>=6.0",
]
# Optional AMR parser dep. amrlib is t5-based and pulls a ~500 MB
# checkpoint on first model load — opt-in only. The AmrParserClient
# constructor succeeds without it; only parse() requires the import.
amr = [
    "amrlib>=0.8.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["catalyst_langgraph*"]

[tool.setuptools.package-data]
catalyst_langgraph = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
pythonpath = ["src"]
markers = [
    "unit: tests with no external deps (no network, no services)",
    "integration: tests that touch local services (litellm proxy, ollama)",
]

[tool.uv.sources]
catalyst-exgraph = { path = "../catalyst-exgraph", editable = true }

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pyflakes only (F) — unused imports, undefined names, unused vars.
# Style rules (E/W) intentionally NOT enabled; we don't want a noisy
# blackhole. Add rules later only with explicit consensus.
select = ["F"]
