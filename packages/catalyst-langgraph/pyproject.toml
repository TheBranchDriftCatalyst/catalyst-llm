[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catalyst-langgraph"
version = "0.3.0"
description = "LangGraph-based agent service for Catalyst — wraps LiteLLM, calls tool-host, streams typed events to UIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Catalyst Team" }
]

dependencies = [
    "langchain-openai>=0.1.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.2.0",
    "httpx>=0.24.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["catalyst_langgraph*"]

[tool.setuptools.package-data]
catalyst_langgraph = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
pythonpath = ["src"]
markers = [
    "unit: tests with no external deps (no network, no services)",
    "integration: tests that touch local services (litellm proxy, ollama)",
]
