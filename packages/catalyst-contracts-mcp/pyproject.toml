[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catalyst-contracts-mcp"
version = "0.1.0"
description = "MCP server enforcing extraction-domain contracts (validators sourced from catalyst-exgraph)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.9",
    # Validators + models for the extraction domain live in
    # catalyst-exgraph. This package is just the deployable MCP
    # service wrapper around them — a thin tools layer + the
    # append-only JSONL audit trail.
    "catalyst-exgraph",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[project.scripts]
catalyst-contracts-mcp = "catalyst_contracts_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/catalyst_contracts_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
catalyst-exgraph = { path = "../catalyst-exgraph", editable = true }
